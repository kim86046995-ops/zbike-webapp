<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무위탁계약서 목록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <!-- PDF 생성 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4 max-w-6xl">
        <div class="bg-white rounded-lg shadow-md p-6">
            <!-- 뒤로가기 버튼 추가 -->
            <div class="mb-4">
                <a href="/dashboard" class="text-blue-600 hover:text-blue-800 hover:bg-blue-50 px-3 py-2 rounded-lg text-sm inline-flex items-center transition-colors">
                    <i class="fas fa-arrow-left mr-2"></i>운영현황으로 돌아가기
                </a>
            </div>
            
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold"><i class="fas fa-file-contract mr-2"></i>업무위탁계약서</h1>
                <a href="/static/work-contract-new.html" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">
                    <i class="fas fa-plus mr-2"></i>새 계약서
                </a>
            </div>
            
            <div id="list"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script>
        // 로그인 체크
        const sessionId = localStorage.getItem('sessionId');
        if (!sessionId) {
            alert('로그인이 필요합니다.');
            window.location.href = '/static/login.html';
        }
        
        axios.defaults.headers.common['X-Session-ID'] = sessionId;
        
        async function load() {
            const res = await axios.get('/api/work-contracts');
            const list = document.getElementById('list');
            
            if (res.data.length === 0) {
                list.innerHTML = '<div class="text-center py-12 text-gray-500">등록된 계약서가 없습니다</div>';
                return;
            }
            
            list.innerHTML = res.data.map(c => `
                <div class="border p-4 mb-4 rounded hover:bg-gray-50">
                    <div class="flex justify-between">
                        <div>
                            <div class="font-bold">${c.worker_name}</div>
                            <div class="text-sm text-gray-600">${c.worker_phone} | ${c.contract_number}</div>
                            <div class="text-sm">${c.start_date} ~ ${c.end_date || '무기한'}</div>
                            <span class="badge ${c.status === 'active' ? 'bg-green-500' : c.status === 'pending' ? 'bg-yellow-500' : 'bg-gray-500'} text-white px-2 py-1 rounded text-xs">
                                ${c.status === 'active' ? '진행중' : c.status === 'pending' ? '서명대기' : '완료'}
                            </span>
                        </div>
                        <div>
                            ${c.status === 'pending' ? `
                                <button onclick="sendSMS(${c.id}, '${c.worker_name}', '${c.worker_phone}')" class="bg-blue-600 text-white px-3 py-1 rounded text-sm mr-2">
                                    <i class="fas fa-sms"></i> SMS 발송
                                </button>
                            ` : ''}
                            <button onclick="showDetail(${c.id})" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1 rounded text-sm mr-2">
                                <i class="fas fa-info-circle"></i> 상세
                            </button>
                            <button onclick="remove(${c.id})" class="bg-red-600 text-white px-3 py-1 rounded text-sm">
                                <i class="fas fa-trash"></i> 삭제
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        async function sendSMS(id, name, phone) {
            if (!confirm(`${name}님에게 서명 요청 SMS를 발송하시겠습니까?`)) return;
            
            const shareUrl = `${window.location.origin}/static/work-contract-sign.html?id=${id}`;
            
            const smsData = {
                phone: phone,
                message: `[Z-BIKE 업무위탁계약서]\n\n${name}님 계약내용 확인 후 서명해주세요.\n\n링크: ${shareUrl}\n\n* 72시간 이내 서명 부탁드립니다.`
            };
            
            console.log('📱 SMS 발송 요청 데이터:', smsData);
            
            try {
                const response = await axios.post('/api/send-sms', smsData);
                console.log('✅ SMS 발송 성공:', response.data);
                alert('SMS가 발송되었습니다');
            } catch (error) {
                console.error('❌ SMS 발송 실패:', error);
                console.error('에러 응답:', error.response?.data);
                alert('SMS 발송 실패: ' + (error.response?.data?.message || error.message));
            }
        }
        
        // 상세 정보 표시
        async function showDetail(id) {
            try {
                const response = await axios.get(`/api/work-contracts/${id}`)
                const contract = response.data
                
                const paymentTypeText = {
                    'commission': '건당 수수료',
                    'daily': '일당',
                    'monthly': '월급'
                };
                
                // 모달 생성
                const modal = document.createElement('div')
                modal.id = 'detailModal'
                modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50'
                modal.onclick = (e) => { if (e.target === modal) closeDetail() }
                modal.innerHTML = `
                    <div class="bg-white rounded-lg max-w-5xl w-full max-h-[90vh] overflow-y-auto my-8">
                        <div class="p-6">
                            <!-- 헤더 -->
                            <div class="flex justify-between items-center mb-6 sticky top-0 bg-white z-10 pb-4 border-b">
                                <h2 class="text-2xl font-bold text-gray-800">
                                    <i class="fas fa-file-contract text-purple-600 mr-2"></i>
                                    업무위탁계약서 상세
                                </h2>
                                <button onclick="closeDetail()" class="text-gray-500 hover:text-gray-700">
                                    <i class="fas fa-times text-2xl"></i>
                                </button>
                            </div>

                            <!-- 계약서 전문 -->
                            <div class="bg-white border-2 border-gray-300 rounded-lg p-6 mb-6">
                                <h1 class="text-2xl font-bold mb-6 text-center">배달업무위탁계약서</h1>
                                
                                <div class="mb-6 text-sm leading-relaxed">
                                    <p class="mb-4 text-center">대성 배달대행 (이하 "갑")과(와) <span class="font-bold">${contract.worker_name || '[근로자명]'}</span> (이하 "을")은(는) 다음과 같이 배달업무위탁계약을 체결한다.</p>
                                    
                                    <div class="space-y-6">
                                        <div class="border p-4 rounded bg-gray-50">
                                            <h3 class="font-bold mb-3 text-base">제1조 (계약의 성격)</h3>
                                            <div class="space-y-2 pl-4">
                                                <p>1. 본 계약은 근로계약이 아닌 업무위탁계약이다.</p>
                                                <p>2. 을은 갑에 종속된 근로자가 아니며, 독립적인 사업자로서 업무를 수행한다.</p>
                                                <p>3. 갑은 을에 대하여 근태관리, 출퇴근통제, 최소근무시간을 강제하지 않는다.</p>
                                                <p>4. 을은 업무수행 시간, 장소, 방법을 자유롭게 결정할 수 있다.</p>
                                            </div>
                                        </div>
                                        
                                        <div class="border p-4 rounded bg-gray-50">
                                            <h3 class="font-bold mb-3 text-base">제2조 (위탁업무의 내용)</h3>
                                            <div class="space-y-2 pl-4">
                                                <p>1. 갑은 을에게 배달업무를 위탁하고, 을은 이를 수행한다.</p>
                                                <p>2. 위탁업무 수행 지역: <span class="font-bold">${contract.work_area || '광주시 전역'}</span></p>
                                                <p>3. 을은 배달업무 수행 시 교통법규를 준수하고 안전운전에 유의해야 한다.</p>
                                            </div>
                                        </div>
                                        
                                        <div class="border p-4 rounded bg-gray-50">
                                            <h3 class="font-bold mb-3 text-base">제3조 (비용 부담)</h3>
                                            <div class="space-y-2 pl-4">
                                                <p>1. 오토바이, 유류비, 보험료, 통신비 등은 을이 부담하는 것을 원칙으로 한다.</p>
                                                <p>2. 렌트 시에는 별도 계약을 체결한다.</p>
                                            </div>
                                        </div>
                                        
                                        <div class="border p-4 rounded bg-gray-50">
                                            <h3 class="font-bold mb-3 text-base">제4조 (보험 및 사고책임)</h3>
                                            <div class="space-y-2 pl-4">
                                                <p>1. 을은 책임보험을 유지할 의무가 있다.</p>
                                                <p>2. 사고 발생 시 1차 책임은 을에게 있다.</p>
                                                <p>3. 보험 미가입 상태에서 발생한 사고는 전액 을이 책임진다.</p>
                                            </div>
                                        </div>
                                        
                                        <div class="border p-4 rounded bg-gray-50">
                                            <h3 class="font-bold mb-3 text-base">제5조 (계약기간)</h3>
                                            <div class="space-y-2 pl-4">
                                                <p>1. 계약기간: <span class="font-bold">${contract.start_date || '계약일'}</span> ~ 해지 원할 때 까지</p>
                                                <p>2. 계약기간 만료 후 당사자 간 합의에 따라 계약을 연장할 수 있다.</p>
                                            </div>
                                        </div>
                                        
                                        <div class="border p-4 rounded bg-gray-50">
                                            <h3 class="font-bold mb-3 text-base">제6조 (위탁수수료)</h3>
                                            <div class="space-y-2 pl-4">
                                                <p>1. 지급방식: <span class="font-bold">${paymentTypeText[contract.payment_type] || '건당 수수료'}</span></p>
                                                <p>2. 갑은 매일 또는 주정산으로 플랫폼에서 정산하는 기준으로 정산을 지급한다.</p>
                                                <p>3. 다음 금액은 정산 시 공제 가능하다:</p>
                                                <div class="pl-4 space-y-1">
                                                    <p>가. 리스 및 렌트료</p>
                                                    <p>나. 사고부담금</p>
                                                    <p>다. 차용금</p>
                                                    <p>라. 장비대여료</p>
                                                    <p>마. 미납금</p>
                                                </div>
                                                <p>4. 세금은 세법에 따라 원천징수하며, 을은 사업소득자로서 종합소득세 신고의무를 진다.</p>
                                            </div>
                                        </div>
                                        
                                        <div class="border p-4 rounded bg-gray-50">
                                            <h3 class="font-bold mb-3 text-base">제7조 (업무 수행장비)</h3>
                                            <div class="space-y-2 pl-4">
                                                <p>1. 을은 업무수행에 필요한 배달차량(오토바이 등)을 직접 준비하거나, 갑으로부터 리스/렌트/대여할 수 있다.</p>
                                                <p>2. 갑으로부터 차량을 리스/렌트/대여받는 경우, 별도의 차량리스계약서 또는 차량대여계약서를 작성한다.</p>
                                                <p>3. 갑은 리스, 렌트 시 차량의 보험가입 및 정기점검 의무를 진다. 단 정비시기를 넘겨 차량에 이상이 있을 시는 을이 모든 책임을 진다.</p>
                                                <p>4. 자차일 경우 을은 보험가입 및 정기점검 의무를 진다.</p>
                                            </div>
                                        </div>
                                        
                                        <div class="border p-4 rounded bg-red-50">
                                            <h3 class="font-bold mb-3 text-base text-red-700">제8조 (리스·렌트·차용 후 연락두절 시 책임)</h3>
                                            <div class="space-y-2 pl-4">
                                                <p class="font-bold text-red-700">1. 을이 갑으로부터 차량을 리스, 렌트, 차용 후 정당한 사유 없이 7일 이상 연락이 두절되는 경우:</p>
                                                <div class="pl-4 space-y-1">
                                                    <p>가. 갑은 즉시 차량반환을 요구할 수 있다.</p>
                                                    <p>나. 을은 차량 리스료/렌트료 전액 및 지연손해금(연 24%)을 지급해야 한다.</p>
                                                    <p>다. 을은 차량 손괴, 분실 등에 대한 모든 손해배상책임을 진다.</p>
                                                    <p>라. 갑은 횡령죄(형법 제355조), 사기죄(형법 제347조)로 형사고소할 수 있다.</p>
                                                </div>
                                                <p class="font-bold text-red-700">2. 을이 차량을 임의로 처분, 담보제공, 매각, 폐차하는 경우 횡령죄가 성립된다.</p>
                                                <p class="font-bold text-red-700">3. 갑은 차량 회수를 위해 GPS 추적, 경찰신고, 채권추심 등 모든 법적 조치를 취할 수 있다.</p>
                                            </div>
                                        </div>
                                        
                                        <div class="border p-4 rounded bg-gray-50">
                                            <h3 class="font-bold mb-3 text-base">제9조 (손해배상)</h3>
                                            <div class="space-y-2 pl-4">
                                                <p>1. 을이 고의 또는 중과실로 갑 또는 제3자에게 손해를 입힌 경우 손해배상책임을 진다.</p>
                                                <p>2. 배달 중 교통사고 발생 시, 을은 본인 가입 보험으로 처리하며 갑은 책임을 지지 않는다.</p>
                                            </div>
                                        </div>
                                        
                                        <div class="border p-4 rounded bg-gray-50">
                                            <h3 class="font-bold mb-3 text-base">제10조 (계약의 해지)</h3>
                                            <div class="space-y-2 pl-4">
                                                <p>1. 당사자 일방은 7일 전 서면통지로 계약을 해지할 수 있다.</p>
                                                <p>2. 다음의 경우 즉시 해지할 수 있다:</p>
                                                <div class="pl-4 space-y-1">
                                                    <p>가. 상대방이 계약을 중대하게 위반한 경우</p>
                                                    <p>나. 을이 7일 이상 연락두절된 경우</p>
                                                    <p>다. 을이 고의적으로 갑에게 손해를 입힌 경우</p>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="border p-4 rounded bg-gray-50">
                                            <h3 class="font-bold mb-3 text-base">제11조 (비밀유지)</h3>
                                            <div class="space-y-2 pl-4">
                                                <p>1. 갑과 을은 본 계약의 이행과정에서 알게 된 상대방의 영업비밀, 기술정보, 고객정보 등 일체의 비밀정보를 제3자에게 누설하거나 본 계약 이외의 목적으로 사용할 수 없다.</p>
                                                <p>2. 비밀유지 의무는 계약 종료 후에도 2년간 유효하다.</p>
                                                <p>3. 비밀유지 의무를 위반한 경우, 위반 당사자는 상대방에게 발생한 손해를 배상할 책임이 있다.</p>
                                                <p>4. 다음 정보는 비밀유지 의무에서 제외된다:</p>
                                                <div class="pl-4">
                                                    <p>가. 공지된 정보 또는 공지될 예정인 정보</p>
                                                    <p>나. 법령에 따라 공개가 요구되는 정보</p>
                                                    <p>다. 제3자로부터 적법하게 취득한 정보</p>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="border p-4 rounded bg-gray-50">
                                            <h3 class="font-bold mb-3 text-base">제12조 (개인정보 보호)</h3>
                                            <div class="space-y-2 pl-4">
                                                <p>1. 갑과 을은 업무수행 중 취득한 개인정보를 본 계약 목적 외에 사용하거나 제3자에게 제공할 수 없다.</p>
                                                <p>2. 계약 종료 시 보유 중인 개인정보를 즉시 파기해야 한다.</p>
                                            </div>
                                        </div>
                                        
                                        <div class="border p-4 rounded bg-gray-50">
                                            <h3 class="font-bold mb-3 text-base">제13조 (분쟁해결)</h3>
                                            <div class="space-y-2 pl-4">
                                                <p>1. 본 계약과 관련한 분쟁은 상호 협의하여 해결한다.</p>
                                                <p>2. 협의가 이루어지지 않을 경우 갑의 주소지 관할법원을 제1심 관할법원으로 한다.</p>
                                            </div>
                                        </div>
                                        
                                        ${contract.special_terms ? `
                                            <div class="border p-4 rounded bg-blue-50">
                                                <h3 class="font-bold mb-3 text-base">제14조 (특약사항)</h3>
                                                <div class="pl-4 whitespace-pre-wrap">${contract.special_terms}</div>
                                            </div>
                                        ` : ''}
                                    </div>
                                    
                                    <div class="mt-8 text-center">
                                        <div class="mb-4 bg-yellow-50 border-4 border-yellow-400 rounded-lg p-6 inline-block max-w-4xl">
                                            <div class="flex items-start">
                                                <i class="fas fa-check-square text-yellow-700 text-3xl mr-4 mt-1"></i>
                                                <div class="text-left">
                                                    <p class="font-bold text-gray-900 mb-3 text-lg">✓ 전자서명 계약 동의</p>
                                                    <p class="text-gray-800 text-base leading-relaxed">본 계약은 전자서명 계약이며 계약서 원본은 갑이 보관하며 을은 언제든지 열람 및 출력할 수 있다.</p>
                                                </div>
                                            </div>
                                        </div>
                                        <p class="mt-4 font-bold text-base">${contract.created_at ? new Date(contract.created_at).toLocaleDateString('ko-KR', {year: 'numeric', month: 'long', day: 'numeric'}) : ''}</p>
                                    </div>
                                </div>
                                
                                <div class="space-y-6 mt-8">
                                    <div class="border p-4 rounded bg-blue-50">
                                        <div class="flex justify-between items-start">
                                            <div class="flex-1">
                                                <h3 class="font-bold mb-3 text-lg">갑 (위탁자)</h3>
                                                <div class="space-y-2">
                                                    <p>상호: <span class="font-bold">대성 배달대행</span></p>
                                                    <p>사업자번호: <span class="font-bold">487-39-01128</span></p>
                                                    <p class="flex items-center">대표자: <span class="font-bold">김상춘</span> <img src="/static/company-seal.png" alt="갑 도장" class="ml-1" style="width: 120px; height: 120px; object-fit: contain; vertical-align: middle; background: #EEF2FF; padding: 10px; mix-blend-mode: darken;"></p>
                                                    <p>주소: <span class="font-bold">광주광역시 광산구 신가삼효로 31, 1층 플러스 사무실</span></p>
                                                    <p>전화번호: <span class="font-bold">010-8604-6995</span></p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="border p-4 rounded bg-green-50">
                                        <div class="flex justify-between items-start">
                                            <div class="flex-1">
                                                <h3 class="font-bold mb-3 text-lg">을 (수탁자)</h3>
                                                <div class="space-y-2">
                                                    <p>성명: <span class="font-bold">${contract.worker_name || '[근로자명]'}</span></p>
                                                    <p>주민등록번호: <span class="font-bold">${contract.worker_id_number || '[주민등록번호]'}</span></p>
                                                    <p>주소: <span class="font-bold">${contract.worker_address || '[주소]'}</span></p>
                                                    <p>연락처: <span class="font-bold">${contract.worker_phone || '[전화번호]'}</span></p>
                                                </div>
                                            </div>
                                            ${contract.worker_signature ? `
                                            <div class="ml-4">
                                                <div class="bg-white p-4 rounded-lg border-4 border-green-500">
                                                    <img src="${contract.worker_signature}" alt="을 서명" class="w-72 h-72 object-contain">
                                                </div>
                                                <p class="text-sm text-gray-700 mt-2 font-semibold">
                                                    <i class="fas fa-pen-nib text-green-600 mr-1"></i>본인이 직접 계약 하였음을 서명합니다
                                                </p>
                                            </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 신분증 정보 -->
                            ${contract.id_card_image ? `
                            <div class="bg-gray-50 rounded-lg p-4">
                                <h3 class="text-lg font-bold text-gray-800 mb-4">
                                    <i class="fas fa-id-card text-orange-600 mr-2"></i>
                                    신분증 사본
                                </h3>
                                <div class="flex justify-center">
                                    <img src="${contract.id_card_image}" alt="신분증" class="border border-gray-300 rounded-lg max-w-md max-h-96 object-contain">
                                </div>
                            </div>
                            ` : `
                            <div class="bg-gray-50 rounded-lg p-4">
                                <h3 class="text-lg font-bold text-gray-800 mb-4">
                                    <i class="fas fa-id-card text-orange-600 mr-2"></i>
                                    신분증 사본
                                </h3>
                                <p class="text-center text-gray-500">신분증이 등록되지 않았습니다</p>
                            </div>
                            `}

                            <!-- 버튼 그룹 -->
                            <div class="mt-6 flex gap-3 justify-end">
                                <button onclick="downloadPDF(${contract.id})" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg flex items-center">
                                    <i class="fas fa-file-pdf mr-2"></i>PDF 다운로드
                                </button>
                                <button onclick="closeDetail()" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-2 rounded-lg">
                                    <i class="fas fa-times mr-2"></i>닫기
                                </button>
                            </div>
                        </div>
                    </div>
                `
                
                document.body.appendChild(modal)
                
                // ESC 키로 닫기
                modal.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeDetail()
                })
                
                // 배경 클릭으로 닫기
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeDetail()
                })
            } catch (error) {
                console.error('상세 정보 로드 오류:', error)
                alert('상세 정보를 불러오는데 실패했습니다')
            }
        }

        // 상세 모달 닫기
        function closeDetail() {
            const modal = document.getElementById('detailModal')
            if (modal) {
                modal.remove()
            }
        }
        
        // PDF 다운로드
        async function downloadPDF(contractId) {
            try {
                console.log('Starting PDF generation for contract:', contractId);
                
                // 계약서 데이터 가져오기
                const response = await axios.get(`/api/work-contracts/${contractId}`)
                const contract = response.data
                
                // 상세 모달에서 계약서 콘텐츠 가져오기
                const detailModal = document.getElementById('detailModal');
                if (!detailModal) {
                    alert('상세 정보를 불러올 수 없습니다.');
                    return;
                }
                
                const modalContent = detailModal.querySelector('.bg-white.border-2.border-gray-300');
                if (!modalContent) {
                    alert('계약서 내용을 찾을 수 없습니다.');
                    return;
                }
                
                // PDF용 컨테이너 생성
                const pdfContainer = document.createElement('div');
                pdfContainer.style.width = '210mm'; // A4 폭
                pdfContainer.style.minHeight = '297mm'; // A4 높이
                pdfContainer.style.padding = '15mm'; // 여백
                pdfContainer.style.backgroundColor = '#ffffff';
                pdfContainer.style.position = 'absolute';
                pdfContainer.style.left = '-9999px'; // 화면 밖으로
                pdfContainer.style.top = '0';
                pdfContainer.style.fontFamily = 'Malgun Gothic, Arial, sans-serif';
                pdfContainer.style.fontSize = '11pt';
                pdfContainer.style.lineHeight = '1.6';
                pdfContainer.style.color = '#000000';
                pdfContainer.style.boxSizing = 'border-box';
                
                // 모달 내용 복제
                const clonedContent = modalContent.cloneNode(true);
                
                // Tailwind 클래스를 인라인 스타일로 변환
                // 제목
                const title = clonedContent.querySelector('h1');
                if (title) {
                    title.style.textAlign = 'center';
                    title.style.fontSize = '24pt';
                    title.style.fontWeight = 'bold';
                    title.style.marginBottom = '20px';
                    title.style.color = '#000000';
                }
                
                // 조항 박스들
                const clauseBoxes = clonedContent.querySelectorAll('.border.rounded');
                clauseBoxes.forEach(box => {
                    box.style.marginBottom = '15px';
                    box.style.padding = '12px';
                    box.style.backgroundColor = '#f9fafb';
                    box.style.border = '1px solid #e5e7eb';
                    box.style.borderRadius = '5px';
                    box.style.pageBreakInside = 'avoid';
                });
                
                // 조항 제목들
                const clauseTitles = clonedContent.querySelectorAll('h3');
                clauseTitles.forEach(h3 => {
                    h3.style.fontWeight = 'bold';
                    h3.style.fontSize = '13pt';
                    h3.style.marginBottom = '8px';
                    h3.style.color = '#000000';
                });
                
                // 동의 체크박스
                const agreementBox = clonedContent.querySelector('.bg-yellow-50');
                if (agreementBox) {
                    agreementBox.style.backgroundColor = '#fef9c3';
                    agreementBox.style.border = '4px solid #facc15';
                    agreementBox.style.borderRadius = '8px';
                    agreementBox.style.padding = '16px';
                    agreementBox.style.marginBottom = '20px';
                    agreementBox.style.display = 'inline-block';
                    agreementBox.style.maxWidth = '100%';
                }
                
                // 갑/을 정보 박스
                const partyBoxes = clonedContent.querySelectorAll('.bg-blue-50, .bg-green-50');
                partyBoxes.forEach(box => {
                    box.style.padding = '15px';
                    box.style.borderRadius = '5px';
                    box.style.marginBottom = '15px';
                    box.style.pageBreakInside = 'avoid';
                    if (box.classList.contains('bg-blue-50')) {
                        box.style.backgroundColor = '#dbeafe';
                        box.style.border = '1px solid #3b82f6';
                    } else {
                        box.style.backgroundColor = '#d1fae5';
                        box.style.border = '1px solid #10b981';
                    }
                });
                
                // 이미지 크기 조정
                const images = clonedContent.querySelectorAll('img');
                images.forEach(img => {
                    img.style.maxWidth = '100%';
                    img.style.height = 'auto';
                });
                
                pdfContainer.appendChild(clonedContent);
                document.body.appendChild(pdfContainer);
                
                // 로딩 표시
                const loadingDiv = document.createElement('div');
                loadingDiv.style.position = 'fixed';
                loadingDiv.style.top = '50%';
                loadingDiv.style.left = '50%';
                loadingDiv.style.transform = 'translate(-50%, -50%)';
                loadingDiv.style.backgroundColor = 'rgba(0,0,0,0.8)';
                loadingDiv.style.color = 'white';
                loadingDiv.style.padding = '20px 40px';
                loadingDiv.style.borderRadius = '10px';
                loadingDiv.style.zIndex = '10000';
                loadingDiv.style.fontSize = '18px';
                loadingDiv.style.fontWeight = 'bold';
                loadingDiv.textContent = 'PDF 생성 중...';
                document.body.appendChild(loadingDiv);
                
                // DOM 렌더링 대기
                await new Promise(resolve => setTimeout(resolve, 500));
                
                console.log('Capturing content...');
                
                // html2canvas로 캡처
                const canvas = await html2canvas(pdfContainer, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff',
                    logging: false,
                    width: pdfContainer.scrollWidth,
                    height: pdfContainer.scrollHeight,
                    windowWidth: pdfContainer.scrollWidth,
                    windowHeight: pdfContainer.scrollHeight
                });
                
                console.log('Canvas created:', canvas.width, 'x', canvas.height);
                
                // jsPDF로 PDF 생성
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });
                
                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                const pdfWidth = 210; // A4 width in mm
                const pdfHeight = 297; // A4 height in mm
                const imgWidth = pdfWidth;
                const imgHeight = (canvas.height * pdfWidth) / canvas.width;
                
                let heightLeft = imgHeight;
                let position = 0;
                
                // 첫 페이지
                pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight, undefined, 'FAST');
                heightLeft -= pdfHeight;
                
                // 추가 페이지
                while (heightLeft > 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight, undefined, 'FAST');
                    heightLeft -= pdfHeight;
                }
                
                // PDF 저장
                const fileName = `업무위탁계약서_${contract.worker_name || contract.contract_number}_${new Date().toLocaleDateString('ko-KR').replace(/\. /g, '-').replace('.', '')}.pdf`;
                pdf.save(fileName);
                
                console.log('PDF generation complete');
                
                // 정리
                document.body.removeChild(pdfContainer);
                document.body.removeChild(loadingDiv);
                
            } catch (error) {
                console.error('PDF generation error:', error);
                alert('PDF 생성 중 오류가 발생했습니다: ' + error.message);
                // 정리
                const pdfContainer = document.querySelector('div[style*="-9999px"]');
                if (pdfContainer) document.body.removeChild(pdfContainer);
                const loadingDiv = document.querySelector('div[style*="fixed"][style*="10000"]');
                if (loadingDiv) document.body.removeChild(loadingDiv);
            }
        }

        async function remove(id) {
            if (!confirm('삭제하시겠습니까?')) return;
            
            try {
                await axios.delete(`/api/work-contracts/${id}`);
                alert('삭제되었습니다');
                await load(); // Wait for the list to reload
            } catch (error) {
                console.error('Delete error:', error);
                alert('삭제 실패: ' + (error.response?.data?.message || error.message));
            }
        }
        
        load();
    </script>
</body>
</html>
