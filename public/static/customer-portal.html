<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-BIKE 고객 정보 등록</title>
    
    <!-- Open Graph / 카카오톡 공유 미리보기 -->
    <meta property="og:title" content="Z-BIKE 고객 정보 등록">
    <meta property="og:description" content="여기를 통해 빠르고 확실하게 고객 정보를 등록해주세요">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://zbike-webapp.pages.dev/static/og-image.png">
    <meta property="og:image:width" content="1424">
    <meta property="og:image:height" content="752">
    <meta property="og:image:alt" content="Z-BIKE 로고">
    <meta property="og:image:type" content="image/png">
    <meta property="og:url" content="https://zbike-webapp.pages.dev/static/customer-portal.html">
    <meta property="og:site_name" content="Z-BIKE">
    
    <!-- 카카오톡 전용 메타 태그 -->
    <meta property="kakao:title" content="Z-BIKE 고객 정보 등록">
    <meta property="kakao:description" content="여기를 통해 빠르고 확실하게 고객 정보를 등록해주세요">
    <meta property="kakao:image" content="https://zbike-webapp.pages.dev/static/og-image.png">
    
    <!-- 트위터 카드 -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Z-BIKE 고객 정보 등록">
    <meta name="twitter:description" content="여기를 통해 빠르고 확실하게 고객 정보를 등록해주세요">
    <meta name="twitter:image" content="https://zbike-webapp.pages.dev/static/og-image.png">
    
    <meta name="description" content="Z-BIKE 고객 정보 등록 - 오토바이 계약을 간편하게">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-purple-500 to-pink-600 min-h-screen p-4">
    <div class="max-w-6xl mx-auto py-8">
        <!-- 헤더 -->
        <div class="text-center mb-8">
            <div class="bg-white w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4 shadow-xl">
                <i class="fas fa-motorcycle text-purple-600 text-5xl"></i>
            </div>
            <h1 class="text-4xl font-bold text-white mb-2">고객 정보 등록</h1>
            <p class="text-white text-lg">필요한 항목을 선택하여 작성해주세요</p>
        </div>

        <!-- 필독 사항 (먼저 표시) -->
        <div class="max-w-md mx-auto mb-6 bg-white rounded-2xl shadow-xl p-6 border-2 border-red-500">
            <h3 class="text-xl font-bold text-red-600 mb-4">
                <i class="fas fa-exclamation-circle text-red-600 mr-2"></i>필독 사항
            </h3>
            <ul class="space-y-2 text-gray-800 font-medium">
                <li><i class="fas fa-chevron-right text-red-600 mr-2"></i><strong class="text-red-600">고객 정보 등록</strong>을 완료하시면 담당자가 연락드립니다.</li>
                <li><i class="fas fa-chevron-right text-red-600 mr-2"></i><strong class="text-red-600">모든 정보는 정확하게</strong> 입력해주세요.</li>
                <li><i class="fas fa-chevron-right text-red-600 mr-2"></i><strong class="text-red-600">주소는 현재 살고 있는 주소</strong> 입력해 주세요 (확인 후 승인)합니다.</li>
                <li><i class="fas fa-chevron-right text-red-600 mr-2"></i>문의사항이 있으시면 담당자에게 연락주세요.</li>
            </ul>
        </div>

        <!-- 메뉴 카드 -->
        <div class="max-w-md mx-auto">
            <!-- 고객 정보 등록 카드 -->
            <div class="bg-white rounded-2xl shadow-2xl p-5 hover:shadow-3xl transition transform hover:scale-105">
                <div class="text-center mb-4">
                    <div class="bg-blue-100 w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-user-edit text-blue-600 text-3xl"></i>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800 mb-1">고객 정보 등록</h2>
                    <p class="text-gray-600 text-sm">계약자 정보를 입력해주세요</p>
                </div>
                
                <ul class="space-y-1.5 mb-4 text-gray-700 text-sm">
                    <li><i class="fas fa-check text-green-500 mr-2 text-xs"></i>이름, 연락처 입력</li>
                    <li><i class="fas fa-check text-green-500 mr-2 text-xs"></i>주민등록번호 입력</li>
                    <li><i class="fas fa-check text-green-500 mr-2 text-xs"></i>주소 입력</li>
                </ul>

                <button 
                    onclick="openCustomerForm()"
                    class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-base hover:bg-blue-700 transition transform hover:scale-105 active:scale-95"
                >
                    <i class="fas fa-arrow-right mr-2"></i>고객 정보 등록하기
                </button>
            </div>
        </div>

        <!-- 돌아가기 버튼 -->
        <div class="mt-6 text-center">
            <a href="/static/login.html" class="inline-block bg-white text-purple-600 px-6 py-3 rounded-lg hover:bg-gray-100 transition font-semibold">
                <i class="fas fa-arrow-left mr-2"></i>로그인 페이지로 돌아가기
            </a>
        </div>
    </div>

    <script>
        function openCustomerForm() {
            // 고객 정보 등록 페이지로 이동 (로그인 없이)
            window.location.href = '/static/customer-register.html';
        }


    </script>
</body>
</html>
