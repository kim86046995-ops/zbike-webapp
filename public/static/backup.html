<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>백업 관리 - 전자계약서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        // 즉시 실행: 로그인 체크
        (function() {
            var sessionId = localStorage.getItem('sessionId');
            var user = localStorage.getItem('user');
            if (!sessionId || !user) {
                alert('로그인이 필요합니다.');
                window.location.replace('/login?redirect=' + encodeURIComponent(window.location.pathname));
            }
        })();
    </script>
</head>
<body class="bg-gray-50">
    <!-- 헤더 -->
    <div class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-4">
                    <button onclick="window.history.back()" class="text-gray-600 hover:text-gray-900">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </button>
                    <h1 class="text-2xl font-bold text-gray-900">
                        <i class="fas fa-database mr-2 text-blue-600"></i>
                        백업 관리
                    </h1>
                </div>
                <div class="flex items-center space-x-2">
                    <span id="userName" class="text-sm text-gray-600"></span>
                    <button onclick="logout()" class="px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded">
                        로그아웃
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 메인 컨텐츠 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- 백업 상태 카드 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- 마지막 백업 시간 -->
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <i class="fas fa-clock text-3xl text-blue-600"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-600">마지막 백업</p>
                        <p id="lastBackupTime" class="text-lg font-semibold text-gray-900">확인 중...</p>
                    </div>
                </div>
            </div>

            <!-- 총 백업 횟수 -->
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <i class="fas fa-database text-3xl text-green-600"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-600">총 백업 횟수</p>
                        <p id="totalBackups" class="text-lg font-semibold text-gray-900">0회</p>
                    </div>
                </div>
            </div>

            <!-- 자동 백업 상태 -->
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <i class="fas fa-sync-alt text-3xl text-purple-600"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-600">자동 백업</p>
                        <p class="text-lg font-semibold text-gray-900">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                <i class="fas fa-check-circle mr-1"></i> 활성화
                            </span>
                        </p>
                        <p class="text-xs text-gray-500 mt-1">매일 오전 3시</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 수동 백업 버튼 -->
        <div class="bg-white rounded-lg shadow mb-8">
            <div class="p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4">
                    <i class="fas fa-hand-pointer mr-2 text-blue-600"></i>
                    수동 백업
                </h2>
                <p class="text-sm text-gray-600 mb-4">
                    지금 즉시 데이터베이스를 백업합니다. 백업 파일은 R2 클라우드 스토리지에 저장되며 동시에 PC로도 다운로드됩니다.
                </p>
                <div class="flex space-x-4">
                    <button onclick="manualBackup()" id="manualBackupBtn" 
                        class="flex items-center px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                        <i class="fas fa-download mr-2"></i>
                        전체 백업 (R2 저장 + 다운로드)
                    </button>
                    <button onclick="backupCompaniesOnly()" 
                        class="flex items-center px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                        <i class="fas fa-building mr-2"></i>
                        업체만 백업 (R2 저장 + 다운로드)
                    </button>
                </div>
            </div>
        </div>

        <!-- R2 백업 파일 목록 -->
        <div class="bg-white rounded-lg shadow mb-8">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-gray-900">
                        <i class="fas fa-cloud mr-2 text-blue-600"></i>
                        R2 클라우드 백업 파일
                    </h2>
                    <button onclick="loadR2Backups()" class="text-blue-600 hover:text-blue-800">
                        <i class="fas fa-sync-alt mr-1"></i> 새로고침
                    </button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">파일명</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">백업 타입</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">크기</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">업로드 시간</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">액션</th>
                            </tr>
                        </thead>
                        <tbody id="r2BackupsTable" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="5" class="px-6 py-4 text-center text-gray-500">
                                    <i class="fas fa-spinner fa-spin mr-2"></i> 로딩 중...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 백업 이력 -->
        <div class="bg-white rounded-lg shadow">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-gray-900">
                        <i class="fas fa-history mr-2 text-purple-600"></i>
                        백업 이력
                    </h2>
                    <button onclick="loadBackupLogs()" class="text-blue-600 hover:text-blue-800">
                        <i class="fas fa-sync-alt mr-1"></i> 새로고침
                    </button>
                </div>

                <!-- 필터 -->
                <div class="mb-4 flex space-x-2">
                    <button onclick="filterBackups('all')" id="filter-all" 
                        class="px-4 py-2 text-sm bg-blue-600 text-white rounded">
                        전체
                    </button>
                    <button onclick="filterBackups('SCHEDULED_BACKUP')" id="filter-scheduled" 
                        class="px-4 py-2 text-sm bg-gray-200 text-gray-700 rounded hover:bg-gray-300">
                        자동 백업
                    </button>
                    <button onclick="filterBackups('MANUAL_BACKUP')" id="filter-manual" 
                        class="px-4 py-2 text-sm bg-gray-200 text-gray-700 rounded hover:bg-gray-300">
                        수동 백업
                    </button>
                    <button onclick="filterBackups('INSERT')" id="filter-insert" 
                        class="px-4 py-2 text-sm bg-gray-200 text-gray-700 rounded hover:bg-gray-300">
                        데이터 추가
                    </button>
                    <button onclick="filterBackups('UPDATE')" id="filter-update" 
                        class="px-4 py-2 text-sm bg-gray-200 text-gray-700 rounded hover:bg-gray-300">
                        데이터 수정
                    </button>
                </div>

                <!-- 백업 로그 테이블 -->
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">시간</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">유형</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">테이블</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">레코드 ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">상태</th>
                            </tr>
                        </thead>
                        <tbody id="backupLogsTable" class="bg-white divide-y divide-gray-200">
                            <!-- 데이터 로딩 중 -->
                            <tr>
                                <td colspan="5" class="px-6 py-4 text-center text-gray-500">
                                    <i class="fas fa-spinner fa-spin mr-2"></i>
                                    백업 이력을 불러오는 중...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 페이지네이션 (선택사항) -->
                <div class="mt-4 flex justify-between items-center">
                    <p class="text-sm text-gray-600">
                        총 <span id="totalLogs">0</span>개의 백업 이력
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- 로딩 오버레이 -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 max-w-sm w-full mx-4">
            <div class="text-center">
                <i class="fas fa-spinner fa-spin text-4xl text-blue-600 mb-4"></i>
                <h3 class="text-lg font-semibold mb-2">백업 중...</h3>
                <p class="text-gray-600" id="loadingMessage">데이터를 백업하고 있습니다.</p>
            </div>
        </div>
    </div>

    <script>
        // 세션 정보 가져오기
        const sessionId = localStorage.getItem('sessionId');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const username = user.username || localStorage.getItem('username') || '사용자';

        document.getElementById('userName').textContent = username;

        let allLogs = [];
        let currentFilter = 'all';

        // 초기 로드
        window.addEventListener('DOMContentLoaded', function() {
            loadBackupLogs();
            loadR2Backups();
        });

        // 백업 로그 불러오기
        async function loadBackupLogs() {
            try {
                const response = await fetch('/api/backups/logs', {
                    headers: {
                        'X-Session-ID': sessionId
                    }
                });

                if (!response.ok) {
                    throw new Error('백업 로그를 불러올 수 없습니다.');
                }

                allLogs = await response.json();
                updateStats();
                renderBackupLogs();
            } catch (error) {
                console.error('백업 로그 로드 실패:', error);
                document.getElementById('backupLogsTable').innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-4 text-center text-red-600">
                            <i class="fas fa-exclamation-circle mr-2"></i>
                            백업 이력을 불러오는데 실패했습니다.
                        </td>
                    </tr>
                `;
            }
        }

        // 통계 업데이트
        function updateStats() {
            const scheduledBackups = allLogs.filter(log => log.action_type === 'SCHEDULED_BACKUP');
            const lastBackup = allLogs.length > 0 ? allLogs[0] : null;

            // 마지막 백업 시간
            if (lastBackup) {
                const backupDate = new Date(lastBackup.backup_time);
                document.getElementById('lastBackupTime').textContent = formatDateTime(backupDate);
            } else {
                document.getElementById('lastBackupTime').textContent = '백업 없음';
            }

            // 총 백업 횟수 (자동 백업만)
            document.getElementById('totalBackups').textContent = `${scheduledBackups.length}회`;

            // 총 로그 수
            document.getElementById('totalLogs').textContent = allLogs.length;
        }

        // 백업 로그 렌더링
        function renderBackupLogs() {
            const filteredLogs = currentFilter === 'all' 
                ? allLogs 
                : allLogs.filter(log => log.action_type === currentFilter);

            const tbody = document.getElementById('backupLogsTable');

            if (filteredLogs.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-4 text-center text-gray-500">
                            백업 이력이 없습니다.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filteredLogs.map(log => {
                const actionTypeBadge = getActionTypeBadge(log.action_type);
                const backupDate = new Date(log.backup_time);

                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                            ${formatDateTime(backupDate)}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            ${actionTypeBadge}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                            ${log.table_name || '-'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            ${log.record_id || '-'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                <i class="fas fa-check-circle mr-1"></i> 성공
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 필터링
        function filterBackups(type) {
            currentFilter = type;

            // 버튼 스타일 업데이트
            document.querySelectorAll('[id^="filter-"]').forEach(btn => {
                btn.className = 'px-4 py-2 text-sm bg-gray-200 text-gray-700 rounded hover:bg-gray-300';
            });
            document.getElementById(`filter-${type}`).className = 'px-4 py-2 text-sm bg-blue-600 text-white rounded';

            renderBackupLogs();
        }

        // 수동 백업 (전체)
        async function manualBackup() {
            const btn = document.getElementById('manualBackupBtn');
            const originalText = btn.innerHTML;

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> 백업 중...';

                showLoading('전체 데이터베이스를 백업하고 있습니다...');

                const response = await fetch('/api/backups/export', {
                    headers: {
                        'X-Session-ID': sessionId
                    }
                });

                if (!response.ok) {
                    throw new Error('백업 실패');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `zbike-backup-${Date.now()}.json`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                hideLoading();
                alert('✅ 백업이 완료되었습니다!');

                // 수동 백업 로그 기록
                await fetch('/api/backups/manual', {
                    method: 'POST',
                    headers: {
                        'X-Session-ID': sessionId,
                        'Content-Type': 'application/json'
                    }
                });

                // 로그 새로고침
                loadBackupLogs();
                loadR2Backups();  // R2 목록도 새로고침
            } catch (error) {
                hideLoading();
                console.error('백업 실패:', error);
                alert('❌ 백업에 실패했습니다.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // 업체 데이터만 백업
        async function backupCompaniesOnly() {
            try {
                showLoading('업체 데이터를 백업하고 있습니다...');

                const response = await fetch('/api/backups/export/companies', {
                    headers: {
                        'X-Session-ID': sessionId
                    }
                });

                if (!response.ok) {
                    throw new Error('백업 실패');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `zbike-companies-backup-${Date.now()}.json`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                hideLoading();
                alert('✅ 업체 데이터 백업이 완료되었습니다!');

                // 로그 새로고침
                loadBackupLogs();
                loadR2Backups();  // R2 목록도 새로고침
            } catch (error) {
                hideLoading();
                console.error('백업 실패:', error);
                alert('❌ 백업에 실패했습니다.');
            }
        }

        // R2 백업 파일 목록 불러오기
        async function loadR2Backups() {
            try {
                const response = await fetch('/api/backups/list', {
                    headers: {
                        'X-Session-ID': sessionId
                    }
                });

                if (!response.ok) {
                    throw new Error('R2 백업 목록을 불러올 수 없습니다.');
                }

                const backups = await response.json();
                renderR2Backups(backups);
            } catch (error) {
                console.error('R2 백업 목록 로드 실패:', error);
                document.getElementById('r2BackupsTable').innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-4 text-center text-red-600">
                            <i class="fas fa-exclamation-circle mr-2"></i>
                            R2 백업 목록을 불러오는데 실패했습니다.
                        </td>
                    </tr>
                `;
            }
        }

        // R2 백업 목록 렌더링
        function renderR2Backups(backups) {
            const tbody = document.getElementById('r2BackupsTable');

            if (backups.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-4 text-center text-gray-500">
                            <i class="fas fa-inbox mr-2"></i>
                            R2에 저장된 백업 파일이 없습니다.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = backups.map(backup => {
                const uploadDate = new Date(backup.uploaded);
                const backupType = backup.customMetadata?.backupType || 'unknown';
                const typeBadge = getBackupTypeBadge(backupType);
                const sizeKB = (backup.size / 1024).toFixed(2);

                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 text-sm text-gray-900 font-mono text-xs">
                            ${backup.filename}
                        </td>
                        <td class="px-6 py-4 text-sm">
                            ${typeBadge}
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-600">
                            ${sizeKB} KB
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-600">
                            ${formatDateTime(uploadDate)}
                        </td>
                        <td class="px-6 py-4 text-sm">
                            <button 
                                onclick="downloadFromR2('${backup.filename}')"
                                class="text-blue-600 hover:text-blue-800 font-medium">
                                <i class="fas fa-download mr-1"></i> 다운로드
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // R2에서 백업 다운로드
        async function downloadFromR2(filename) {
            try {
                showLoading('R2에서 백업 파일을 다운로드하는 중...');

                const response = await fetch(`/api/backups/download/${filename}`, {
                    headers: {
                        'X-Session-ID': sessionId
                    }
                });

                if (!response.ok) {
                    throw new Error('백업 다운로드 실패');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);

                hideLoading();
                alert('✅ 백업 파일 다운로드가 완료되었습니다!');
            } catch (error) {
                hideLoading();
                console.error('R2 다운로드 실패:', error);
                alert('❌ 백업 다운로드에 실패했습니다.');
            }
        }

        // 백업 타입 뱃지
        function getBackupTypeBadge(type) {
            const badges = {
                'scheduled': '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-800"><i class="fas fa-clock mr-1"></i> 자동</span>',
                'manual': '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800"><i class="fas fa-hand-pointer mr-1"></i> 수동 전체</span>',
                'manual_table': '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800"><i class="fas fa-table mr-1"></i> 수동 테이블</span>',
            };
            return badges[type] || `<span class="text-xs text-gray-600">${type}</span>`;
        }

        // 유틸리티 함수
        function getActionTypeBadge(type) {
            const badges = {
                'SCHEDULED_BACKUP': '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-800"><i class="fas fa-clock mr-1"></i> 자동 백업</span>',
                'MANUAL_BACKUP': '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800"><i class="fas fa-hand-pointer mr-1"></i> 수동 백업</span>',
                'INSERT': '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800"><i class="fas fa-plus mr-1"></i> 추가</span>',
                'UPDATE': '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800"><i class="fas fa-edit mr-1"></i> 수정</span>',
                'DELETE': '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800"><i class="fas fa-trash mr-1"></i> 삭제</span>'
            };
            return badges[type] || `<span class="text-xs text-gray-600">${type}</span>`;
        }

        function formatDateTime(date) {
            return date.toLocaleString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function showLoading(message) {
            document.getElementById('loadingMessage').textContent = message;
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        function logout() {
            localStorage.removeItem('sessionId');
            localStorage.removeItem('username');
            window.location.href = '/static/login';
        }
    </script>
</body>
</html>
