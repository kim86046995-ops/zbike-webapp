    <style>
        /* 모바일 최적화 */
        * {
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }
        
        /* 컨테이너 최대 너비 제한 해제 */
        .container {
            width: 100% !important;
            max-width: 100% !important;
            padding-left: 1rem !important;
            padding-right: 1rem !important;
        }
        
        @media (min-width: 768px) {
            .container {
                max-width: 768px !important;
                margin-left: auto !important;
                margin-right: auto !important;
            }
        }
        
        @media (min-width: 1024px) {
            .container {
                max-width: 1024px !important;
            }
        }
        
        /* A4 출력 스타일 - 원본 그대로 출력 */
        @media print {
            body {
                margin: 0;
                padding: 0;
                background: white;
            }
            
            /* 모달 배경 숨김 */
            #detailModal {
                position: static !important;
                background: white !important;
                padding: 0 !important;
            }
            
            /* 모달 내용만 표시 */
            .modal-content {
                max-width: 100% !important;
                margin: 0 !important;
                padding: 10mm !important;
                box-shadow: none !important;
            }
            
            /* 버튼과 헤더 숨김 */
            header, .no-print, button, nav {
                display: none !important;
            }
            
            /* A4 페이지 설정 */
            @page {
                size: A4;
                margin: 10mm 12mm;
            }
            
            /* 계약서 컨테이너 - 원본 그대로 */
            .contract-print {
                font-size: 10pt !important;
                line-height: 1.4 !important;
                max-height: none !important;
                overflow: visible !important;
            }
            
            /* 제목 */
            .contract-print h1 {
                font-size: 18pt !important;
                margin-bottom: 8mm !important;
                page-break-after: avoid;
            }
            
            /* 섹션 제목 */
            .contract-print h2,
            .contract-print h3,
            .contract-print h4,
            .contract-print .text-xl {
                font-size: 12pt !important;
                margin-top: 4mm !important;
                margin-bottom: 2mm !important;
                page-break-after: avoid;
            }
            
            /* 본문 텍스트 */
            .contract-print p,
            .contract-print div {
                font-size: 10pt !important;
                line-height: 1.4 !important;
                margin-bottom: 1mm !important;
            }
            
            /* 약관 텍스트 - 더 작고 compact하게 */
            .contract-terms {
                font-size: 9pt !important;
                line-height: 1.3 !important;
                margin-top: 2mm !important;
            }
            
            .contract-terms h3 {
                font-size: 10pt !important;
                margin-top: 3mm !important;
                margin-bottom: 1.5mm !important;
                page-break-after: avoid;
            }
            
            .contract-terms p {
                margin-bottom: 0.5mm !important;
                text-indent: 0 !important;
            }
            
            .contract-terms p.font-bold {
                font-size: 10pt !important;
                margin-top: 2mm !important;
                page-break-after: avoid;
            }
            
            /* 들여쓰기 */
            .contract-terms .ml-4 {
                margin-left: 4mm !important;
            }
            
            .contract-terms .ml-8 {
                margin-left: 8mm !important;
            }
            
            /* 페이지 나누기 방지 - 관련 내용은 함께 */
            .contract-terms > div,
            .contract-terms > p.font-bold {
                page-break-inside: avoid;
            }
            
            /* 약관 동의 체크박스 영역 - 인쇄 시 명확하게 표시 */
            .bg-yellow-50 {
                background-color: #fffbeb !important;
                border: 2px solid #fbbf24 !important;
                padding: 4mm !important;
                margin-bottom: 4mm !important;
                margin-top: 4mm !important;
                page-break-inside: avoid;
                page-break-before: avoid;
            }
            
            .bg-yellow-50 label {
                font-size: 12pt !important;
                font-weight: bold !important;
                line-height: 1.6 !important;
            }
            
            .bg-yellow-50 .fa-check {
                display: inline-block !important;
            }
            
            .bg-green-600 {
                background-color: #16a34a !important;
            }
            
            /* 서명 섹션 - 인쇄 시 명확하게 표시 */
            .contract-print img {
                max-width: 100% !important;
                height: auto !important;
                max-height: 50mm !important;
                page-break-inside: avoid !important;
                page-break-before: avoid !important;
                page-break-after: avoid !important;
                break-inside: avoid !important;
                border: 2px solid #374151 !important;
                border-radius: 2mm !important;
                padding: 2mm !important;
                background: white !important;
                object-fit: contain !important;
            }
            
            /* 신분증 이미지는 더 크게 표시 */
            .contract-print img[alt="신분증"] {
                max-height: 120mm !important;
                width: 100% !important;
            }
            
            /* 서명/신분증 컨테이너 */
            .border-2 {
                border-width: 2px !important;
                padding: 4mm !important;
                page-break-inside: avoid !important;
                page-break-before: avoid !important;
                page-break-after: avoid !important;
                break-inside: avoid !important;
                margin-bottom: 4mm !important;
            }
            
            /* 서명/신분증 제목 */
            .contract-print h3,
            .contract-print h4 {
                font-size: 12pt !important;
                font-weight: bold !important;
                margin-bottom: 2mm !important;
                page-break-after: avoid;
            }
            
            /* 그리드 레이아웃 유지 */
            .grid {
                display: grid !important;
            }
            
            .grid-cols-2 {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 3mm !important;
            }
            
            .grid > div {
                margin-bottom: 0 !important;
            }
            
            /* 배경색 유지 */
            .bg-indigo-50 {
                background-color: #eef2ff !important;
                border: 2px solid #818cf8 !important;
            }
            
            .bg-white {
                background-color: white !important;
            }
            
            .bg-gray-50 {
                background-color: #f9fafb !important;
            }
            
            /* 테이블 */
            table {
                page-break-inside: avoid;
            }
            
            /* 색상 유지 */
            .text-red-600 {
                color: #dc2626 !important;
            }

            }

            }

            }
            
            /* PDF/인쇄시 주민번호 전체 표시 */
            .resident-number-display {
                display: none !important;
            }
            
            .resident-number-full {
                display: inline !important;
            }
        }
        
        /* 모달 스크롤 */
        .modal-content {
            max-height: 85vh;
            overflow-y: auto;
        }
        
        /* 이미지 확대 모달 */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            touch-action: pan-x pan-y pinch-zoom;
        }
        .image-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .image-modal img {
            max-width: 95%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 0.5rem;
        }
        .image-modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 3rem;
            height: 3rem;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            color: #374151;
            transition: all 0.3s;
            z-index: 10001;
        }
        .image-modal-close:hover {
            background: white;
            transform: scale(1.1);
        }
        
        /* ✅ Select dropdown 스타일 개선 - 모든 옵션 표시 */
        select#typeFilter,
        select#statusFilter {
            appearance: auto; /* 브라우저 기본 드롭다운 사용 */
            -webkit-appearance: auto;

        @media (max-width: 768px) {
            select#typeFilter,
            select#statusFilter {
                font-size: 16px; /* iOS zoom 방지 */
            }
        }
    </style>

    <script>
        let contracts = [];
        let filteredContracts = [];
        let currentContract = null;
        let companySettings = null;
        let sessionId = localStorage.getItem('sessionId');
        let currentUser = null; // 현재 사용자 정보
        let currentPage = 1;
        let totalPages = 1;
        let currentSearch = '';
        let searchTimeout = null;

        // 슈퍼관리자 체크 함수
        function isSuperAdmin() {
            if (!currentUser) {
                try {
                    const userStr = localStorage.getItem('user');
                    if (userStr) {
                        currentUser = JSON.parse(userStr);
                    }
                } catch (e) {
                    console.error('Failed to parse user:', e);
                    return false;
                }
            }
            return currentUser && (currentUser.role === 'superadmin' || currentUser.role === 'super_admin' || currentUser.id === 1);
        }

        // 주민번호 마스킹 함수 (화면 표시용)
        function maskResidentNumber(residentNumber) {
            if (!residentNumber) return '-';
            
            // 슈퍼관리자는 전체 보기
            if (isSuperAdmin()) {
                return residentNumber;
            }
            
            // 일반 관리자는 뒷자리 마스킹
            if (residentNumber.length === 13) {
                return residentNumber.substring(0, 6) + '-*******';
            } else if (residentNumber.includes('-')) {
                const parts = residentNumber.split('-');
                return parts[0] + '-*******';
            }
            return residentNumber.substring(0, 6) + '*******';
        }

        // PDF/인쇄용 주민번호 (전체 표시)
        function getFullResidentNumber(residentNumber) {
            return residentNumber || '-';
        }

        // 인증 체크
        async function checkAuth() {
            if (!sessionId) {
                window.location.href = '/static/login.html?redirect=' + encodeURIComponent(window.location.pathname);
                return false;
            }

            try {
                await axios.get('/api/auth/check', {
                    headers: { 'X-Session-ID': sessionId }
                });
                return true;
            } catch (error) {
                localStorage.removeItem('sessionId');
                localStorage.removeItem('user');
                window.location.href = '/static/login.html?redirect=' + encodeURIComponent(window.location.pathname);
                return false;
            }
        }

        // Axios 인터셉터 설정
        axios.interceptors.request.use(config => {
            if (sessionId) {
                config.headers['X-Session-ID'] = sessionId;
            }
            return config;
        });

        axios.interceptors.response.use(
            response => response,
            error => {
                if (error.response?.status === 401) {
                    console.log('⚠️ 401 에러 발생 - 페이지 새로고침');
                    window.location.reload();
                }
                return Promise.reject(error);
            }
        );

        window.addEventListener('DOMContentLoaded', async () => {
            if (await checkAuth()) {
                // URL 파라미터로 전달된 계약 유형 및 상태 필터 확인
                const urlParams = new URLSearchParams(window.location.search);
                const typeParam = urlParams.get('type');
                const statusParam = urlParams.get('status');
                const refreshParam = urlParams.get('refresh');
                
                // refresh 파라미터가 있으면 캐시 클리어
                if (refreshParam) {
                    clearContractsCache();
                    console.log('🔄 URL refresh 파라미터로 캐시 클리어');
                    
                    // URL에서 refresh 파라미터 제거 (깔끔하게)
                    const newUrl = window.location.pathname + 
                        (typeParam || statusParam ? '?' + 
                            (typeParam ? 'type=' + typeParam : '') + 
                            (typeParam && statusParam ? '&' : '') + 
                            (statusParam ? 'status=' + statusParam : '') 
                        : '');
                    window.history.replaceState({}, '', newUrl);
                }
                
                // 계약 유형 필터 설정
                if (typeParam) {
                    const typeFilterElement = document.getElementById('typeFilter');
                    if (typeParam === 'personal') {
                        typeFilterElement.value = 'personal';
                    } else if (typeParam === 'business') {
                        typeFilterElement.value = 'business';
                    } else if (typeParam === 'temp') {
                        typeFilterElement.value = 'temp_rent';
                    }
                }
                
                // 상태 필터 설정
                if (statusParam) {
                    const statusFilterElement = document.getElementById('statusFilter');
                    statusFilterElement.value = statusParam;
                }
                
                await loadCompanySettings();
                await loadContracts();

        // 검색 debounce (500ms 대기 후 서버 검색)
        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                const searchValue = document.getElementById('searchInput').value.trim();
                currentSearch = searchValue;
                currentPage = 1; // 검색 시 1페이지로 리셋
                
                // 검색 시 캐시 무효화 (검색어가 변경되었으므로 새로 조회 필요)
                sessionStorage.removeItem('contracts_cache');
                sessionStorage.removeItem('contracts_cache_time');
                
                await loadContracts(true); // forceRefresh = true
            }, 500);
        }
        
        // 페이지 변경
        async function changePage(page) {
            if (page < 1 || page > totalPages) return;
            
            // 즉시 UI 업데이트 (반응성)
            currentPage = page;
            
            // 로딩 표시
            const listEl = document.getElementById('contractList');
            listEl.innerHTML = `
                <div class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600"></div>
                    <p class="text-gray-600 mt-4">페이지 ${page} 로딩 중...</p>
                </div>
            `;
            
            // 페이지네이션 버튼 즉시 업데이트
            renderPagination();
            
            // 페이지 변경 시 캐시 무효화하고 새로 조회
            sessionStorage.removeItem('contracts_cache');
            sessionStorage.removeItem('contracts_cache_time');
            
            // 데이터 로드 (forceRefresh = true)
            await loadContracts(true);
        }
        
        // 페이지네이션 UI 렌더링
        function renderPagination() {
            const paginationEl = document.getElementById('pagination');
            const topPaginationEl = document.getElementById('topPagination');
            
            if (totalPages <= 1) {
                if (paginationEl) paginationEl.innerHTML = '';
                if (topPaginationEl) topPaginationEl.innerHTML = '';
                return;
            }
            
            // 간단한 페이지 정보 (상단용)
            const simpleHtml = `
                <div class="flex items-center gap-2 text-sm text-gray-600">
                    <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} 
                        class="px-2 py-1 ${currentPage === 1 ? 'text-gray-300 cursor-not-allowed' : 'hover:text-purple-600'}">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span class="font-medium">${currentPage} / ${totalPages}</span>
                    <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} 
                        class="px-2 py-1 ${currentPage === totalPages ? 'text-gray-300 cursor-not-allowed' : 'hover:text-purple-600'}">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            `;
            
            // 전체 페이지네이션 (하단용)
            let html = '<div class="flex justify-center items-center gap-2 mt-6">';
            
            // 이전 버튼
            html += `<button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="px-3 py-2 border rounded-lg ${currentPage === 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white hover:bg-gray-50'}">&larr; 이전</button>`;
            
            // 페이지 번호 (최대 7개 표시)
            const maxVisible = 7;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            
            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }
            
            if (startPage > 1) {
                html += `<button onclick="changePage(1)" class="px-3 py-2 border rounded-lg bg-white hover:bg-gray-50">1</button>`;
                if (startPage > 2) html += '<span class="px-2">...</span>';
            }
            
            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="changePage(${i})" class="px-3 py-2 border rounded-lg ${i === currentPage ? 'bg-purple-600 text-white' : 'bg-white hover:bg-gray-50'}">${i}</button>`;
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += '<span class="px-2">...</span>';
                html += `<button onclick="changePage(${totalPages})" class="px-3 py-2 border rounded-lg bg-white hover:bg-gray-50">${totalPages}</button>`;
            }
            
            // 다음 버튼
            html += `<button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="px-3 py-2 border rounded-lg ${currentPage === totalPages ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white hover:bg-gray-50'}">다음 &rarr;</button>`;
            
            html += '</div>';
            
            // 상단과 하단 모두 렌더링
            if (topPaginationEl) topPaginationEl.innerHTML = simpleHtml;
            if (paginationEl) paginationEl.innerHTML = html;
        }
        
        // API에서 계약 목록 로드 (개인 + 업체 계약 통합 조회)
        async function loadContractsFromAPI(page = 1, search = '') {
            const startTime = performance.now();
            try {
                console.log('🚀 loadContractsFromAPI 시작:', { page, search });
                currentPage = page;
                currentSearch = search;
                
                // 개인 계약과 업체 계약을 병렬로 조회
                const params = new URLSearchParams({ page: page.toString(), limit: '50' });
                if (search) params.append('search', search);
                
                console.log('📡 API 요청 (개인 + 업체)');
                const apiStartTime = performance.now();
                
                // 병렬 요청
                const [personalResponse, businessResponse] = await Promise.all([
                    axios.get(`/api/contracts?${params.toString()}`).catch(err => {
                        console.warn('⚠️ 개인 계약 조회 실패:', err);
                        return { data: { data: [], pagination: { page: 1, total: 0, totalPages: 1 } } };
                    }),
                    axios.get(`/api/business-contracts?${params.toString()}`).catch(err => {
                        console.warn('⚠️ 업체 계약 조회 실패:', err);
                        return { data: { data: [], pagination: { page: 1, total: 0, totalPages: 1 } } };
                    })
                ]);
                
                const apiEndTime = performance.now();
                console.log(`⏱️ API 응답 시간: ${(apiEndTime - apiStartTime).toFixed(0)}ms`);
                
                // 개인 계약 + 업체 계약 병합
                const personalContracts = (personalResponse.data.data || []).map(c => ({
                    ...c,
                    source_type: 'personal',
                    motorcycle_plate: c.plate_number, // 통일
                    customer_phone: c.customer_phone
                }));
                
                const businessContracts = (businessResponse.data.data || []).map(c => ({
                    ...c,
                    source_type: 'business',
                    customer_name: c.company_name || c.representative,
                    customer_phone: c.business_phone || c.representative_phone,
                    motorcycle_plate: c.plate_number // 통일
                }));
                
                // 병합 및 정렬 (최신순)
                contracts = [...personalContracts, ...businessContracts]
                    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                
                // 페이지네이션 정보 (두 API의 total 합산)
                const personalTotal = personalResponse.data.pagination?.total || 0;
                const businessTotal = businessResponse.data.pagination?.total || 0;
                const total = personalTotal + businessTotal;
                
                currentPage = page;
                totalPages = Math.ceil(total / 50);
                
                console.log('📊 전체 계약:', total, '개 (개인:', personalTotal, '업체:', businessTotal, ') - 페이지:', currentPage, '/', totalPages);
                
                filteredContracts = contracts;
                try {
                    const filterStartTime = performance.now();
                    filterContracts(); // 타입/상태 필터 적용
                    const filterEndTime = performance.now();
                    console.log(`⏱️ 필터 처리 시간: ${(filterEndTime - filterStartTime).toFixed(0)}ms`);
                } catch (filterError) {
                    console.error('❌ filterContracts 에러:', filterError);
                    // 필터 에러가 발생해도 전체 목록은 표시
                    renderContracts();
                }
                
                const endTime = performance.now();
                console.log(`⏱️ 전체 로딩 시간: ${(endTime - startTime).toFixed(0)}ms`);
            } catch (error) {
                console.error('❌ loadContractsFromAPI 에러:', error);
                console.error('❌ 에러 상세:', error.response?.data, error.message, error.stack);
                // 에러 시에도 빈 배열로 초기화하고 UI 업데이트
                contracts = [];
                filteredContracts = [];
                // renderContracts()를 직접 호출하여 빈 상태 UI 표시
                renderContracts();
                // 에러를 상위로 전파
                throw error;
            }
        }

        async function loadContracts(forceRefresh = false) {
            console.log('🔄 loadContracts 시작');
            
            // 캐시 확인 (강제 새로고침이 아닐 때만)
            if (!forceRefresh) {
                try {
                    const cacheKey = 'contracts_cache';
                    const cacheTimeKey = 'contracts_cache_time';
                    const cachedData = sessionStorage.getItem(cacheKey);
                    const cacheTime = sessionStorage.getItem(cacheTimeKey);
                    const now = Date.now();
                    
                    // 캐시가 유효하고 검색어가 일치하면 즉시 표시 (5분 이내)
                    if (cachedData && cacheTime && (now - parseInt(cacheTime)) < 300000) {
                        const cached = JSON.parse(cachedData);
                        
                        // 검색어가 일치할 때만 캐시 사용
                        if ((cached.searchQuery || '') === (currentSearch || '')) {
                            console.log('✅ 캐시된 데이터 즉시 표시 (검색어 일치)');
                            contracts = cached.contracts || [];
                            currentPage = cached.currentPage || 1;
                            totalPages = cached.totalPages || 1;
                            filteredContracts = contracts;
                            filterContracts();
                            return;
                        } else {
                            console.log('⚠️ 검색어 불일치 - 캐시 무효화하고 새로 조회');
                            sessionStorage.removeItem(cacheKey);
                            sessionStorage.removeItem(cacheTimeKey);
                        }
                    }
                } catch (cacheError) {
                    console.warn('⚠️ 캐시 읽기 실패 (무시):', cacheError);
                    // 캐시 에러는 무시하고 계속 진행
                }
            }
            
            // 로딩 UI 표시
            const listEl = document.getElementById('contractList');
            listEl.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <i class="fas fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
                    <p class="text-lg font-bold text-gray-800">계약서 목록 불러오는 중...</p>
                </div>
            `;
            
            try {
                await loadContractsFromAPI(currentPage, currentSearch);
                
                // 캐시 저장 시도 (용량 초과 시 무시)
                try {
                    // 최소한의 데이터만 저장 (렌더링에 필요한 필드만)
                    const minimalContracts = contracts.map(c => ({
                        id: c.id,
                        contract_number: c.contract_number,
                        customer_name: c.customer_name,
                        customer_phone: c.customer_phone,
                        company_name: c.company_name,
                        business_phone: c.business_phone,
                        motorcycle_plate: c.motorcycle_plate,
                        plate_number: c.plate_number,
                        vehicle_name: c.vehicle_name,
                        status: c.status,
                        contract_type: c.contract_type,
                        business_type: c.business_type,
                        source_type: c.source_type,
                        signature_data: c.signature_data,
                        start_date: c.start_date,
                        end_date: c.end_date,
                        contract_start_date: c.contract_start_date,
                        contract_end_date: c.contract_end_date
                    }));
                    
                    sessionStorage.setItem('contracts_cache', JSON.stringify({
                        contracts: minimalContracts,
                        currentPage: currentPage,
                        totalPages: totalPages,
                        searchQuery: currentSearch // 검색어도 함께 저장
                    }));
                    sessionStorage.setItem('contracts_cache_time', Date.now().toString());
                    console.log('💾 캐시 저장 완료');
                } catch (storageError) {
                    console.warn('⚠️ 캐시 저장 실패 (용량 부족, 무시):', storageError);
                    // 캐시 저장 실패는 무시하고 계속 진행
                }
                
                console.log('✅ loadContracts 완료');
            } catch (error) {
                console.error('❌ 계약서 목록 로드 실패:', error);
                
                // 401 에러인 경우 로그인 페이지로
                if (error.response?.status === 401) {
                    localStorage.removeItem('sessionId');
                    localStorage.removeItem('user');
                    window.location.href = '/static/login.html?redirect=' + encodeURIComponent(window.location.pathname);
                    return;
                }
                
                listEl.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-exclamation-circle text-4xl text-red-500 mb-4"></i>
                        <p class="text-lg font-bold text-gray-800 mb-2">계약서 목록을 불러오는데 실패했습니다</p>
                        <p class="text-sm text-gray-600 mb-4">${error.response?.data?.error || error.message || '알 수 없는 오류'}</p>
                        <div class="space-x-2">
                            <button onclick="location.reload()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                                <i class="fas fa-redo mr-2"></i>새로고침
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function filterContracts() {
            const companyFilter = document.getElementById('companyFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            
            console.log('🔍 필터 시작 - 회사명:', companyFilter, '타입:', typeFilter, '상태:', statusFilter);
            console.log('📊 전체 계약 수:', contracts.length);

            filteredContracts = contracts.filter(c => {
                // 회사명 매칭 (최우선)
                let matchCompany = !companyFilter;
                if (companyFilter) {
                    if (companyFilter === '대성') {
                        // 대성 = 일반 개인 계약서 (source_type이 'personal')
                        matchCompany = c.source_type === 'personal';
                    } else {
                        // 법인 계약서 = company_name으로 필터링
                        matchCompany = c.company_name === companyFilter;
                    }
                }
                
                // 타입 매칭 로직 개선
                let matchType = !typeFilter;
                if (typeFilter) {
                    if (typeFilter === 'completed') {
                        // 완료: completed 또는 cancelled 상태
                        matchType = c.status === 'completed' || c.status === 'cancelled';
                    } else if (typeFilter === 'temp_rent') {
                        // 임시렌트 (약식, 정식 모두 포함, pending도 포함)
                        matchType = c.contract_type === 'temp_rent' && (c.status === 'active' || c.status === 'pending');
                        console.log('🔎 임시렌트 체크:', c.contract_number, 'contract_type:', c.contract_type, 'status:', c.status, 'matchType:', matchType);
                    } else if (typeFilter === 'business') {
                        // 업체 계약서 (pending도 포함)
                        matchType = c.contract_type === 'business' && (c.status === 'active' || c.status === 'pending');
                    } else if (typeFilter === 'lease') {
                        // 개인 리스 (pending도 포함)
                        matchType = (c.contract_type === 'lease' || c.contract_type === 'individual') && (c.status === 'active' || c.status === 'pending');
                    } else if (typeFilter === 'rent') {
                        // 개인 렌트 (pending도 포함)
                        matchType = c.contract_type === 'rent' && (c.status === 'active' || c.status === 'pending');
                    } else if (typeFilter === 'loan') {
                        // 차용증 (pending도 포함)
                        matchType = c.contract_type === 'loan' && (c.status === 'active' || c.status === 'pending');
                    }
                }
                
                // ✅ 상태 매칭 로직 - 계약 타입이 'completed'가 아닐 때만 적용
                let matchStatus = true;
                if (typeFilter !== 'completed') {
                    // 계약 타입이 완료가 아니면 기본적으로 active와 pending 포함
                    if (statusFilter === 'active') {
                        matchStatus = c.status === 'active' || c.status === 'pending';  // pending도 포함
                    } else if (statusFilter === 'completed,cancelled') {
                        matchStatus = c.status === 'completed' || c.status === 'cancelled';
                    } else {
                        matchStatus = c.status === 'active' || c.status === 'pending';  // pending도 포함
                    }
                }
                
                const finalMatch = matchCompany && matchType && matchStatus;
                
                if (typeFilter === 'temp_rent') {
                    console.log('✅ 임시렌트 최종 결과:', c.contract_number, 'matchType:', matchType, 'matchStatus:', matchStatus, '→ 표시:', finalMatch);
                }
                
                return finalMatch;
            });
            
            console.log('🎯 필터 결과:', filteredContracts.length, '개');

            renderContracts();
        }

        function renderContracts() {

                    } else {
                        // 알 수 없는 타입인 경우 기본값
                        displayTypeText = '렌트';
                    }
                }
                
                const statusColors = {
                    'active': 'bg-green-100 text-green-800',
                    'pending': 'bg-blue-100 text-blue-800',  // pending 상태 색상 추가

                    statusText = (c.signature_data && c.signature_data !== '') ? '진행중' : '서명대기';

                        // 다른 계약은 서명 데이터가 없으면 "서명대기", 있으면 "계약중"
                        statusText = (!c.signature_data || c.signature_data === '') ? '서명대기' : '계약중';
                    }
                } else if (c.status === 'completed') {
                    statusText = '계약종료';
                } else if (c.status === 'cancelled') {
                    statusText = '계약종료';
                } else {
                    statusText = '진행중';  // 기본값

                        remainingDays = `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-blue-100 text-blue-800">남은일수 ${diffDays}일</span>`;
                    } else {

                                    <h3 class="text-base md:text-lg font-bold text-gray-800 mb-1.5">
                                        ${c.contract_number}

                                            ${displayTypeText || '렌트'}

                                    <span class="px-2 py-0.5 rounded-full text-xs font-bold ${statusText === '서명대기' ? 'bg-blue-100 text-blue-800' : statusColors[c.status]}">
                                        ${statusText}
                                    </span>
                                    ${remainingDays}
                                </div>
                            </div>
                            </div>
                            <div class="flex gap-1.5 flex-wrap w-full sm:w-auto justify-end">
                                <button onclick="showDetail('${c.contract_type}', ${c.id})" class="bg-purple-600 text-white px-2.5 md:px-3 py-1.5 text-xs md:text-sm rounded hover:bg-purple-700 flex-1 sm:flex-none">
                                    <i class="fas fa-eye mr-1"></i><span class="hidden sm:inline">상세</span>
                                </button>
                                <button onclick="quickDownloadPDF('${c.contract_type}', ${c.id})" class="bg-green-600 text-white px-2.5 md:px-3 py-1.5 text-xs md:text-sm rounded hover:bg-green-700 flex-1 sm:flex-none" title="PDF 다운로드">
                                    <i class="fas fa-download"></i>
                                </button>
                                ${showCompleteButton ? `
                                <button onclick="completeContract('${c.contract_type}', ${c.id})" class="bg-orange-600 text-white px-2.5 md:px-3 py-1.5 text-xs md:text-sm rounded hover:bg-orange-700 flex-1 sm:flex-none" title="계약 완료">
                                    <i class="fas fa-check-circle mr-1"></i><span class="hidden md:inline">완료</span>
                                </button>
                                ` : ''}
                                <button onclick="deleteContract('${c.contract_type}', ${c.id})" class="bg-red-600 text-white px-2.5 md:px-3 py-1.5 text-xs md:text-sm rounded hover:bg-red-700 flex-1 sm:flex-none">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 md:gap-3 text-xs md:text-sm text-gray-600">
                            <div>
                                <p class="mb-1"><i class="fas fa-user w-4 text-purple-600"></i> <span class="text-sm md:text-base font-bold text-gray-800">${c.customer_name}</span></p>
                                <p class="mb-1"><i class="fas fa-phone w-4 text-purple-600"></i> ${c.customer_phone || c.business_phone || '-'}</p>
                                <p><i class="fas fa-motorcycle w-4 text-purple-600"></i> <span class="text-sm md:text-base font-bold text-gray-800">${c.motorcycle_plate || c.plate_number || '-'}</span> <span class="text-gray-600">(${c.vehicle_name || '-'})</span></p>
                            </div>
                            <div>
                                <p class="mb-1"><i class="fas fa-calendar w-4 text-purple-600"></i> ${c.contract_start_date || c.start_date} ~ ${c.contract_end_date || c.end_date}</p>
                                <p class="mb-1">
                                    <i class="fas fa-won-sign w-4 text-purple-600"></i> 
                                    ${c.business_contract_type === 'lease' ? '리스대여료' : c.business_contract_type === 'rent' ? '렌트대여료' : '대여료'}: 
                                    ${Number(c.monthly_fee || c.daily_amount || 0).toLocaleString()}원
                                </p>
                                <p><i class="fas fa-clock w-4 text-purple-600"></i> ${new Date(c.created_at).toLocaleDateString('ko-KR')}</p>
                            </div>
                        </div>
                    </div>
                `;
                });
                
                listEl.innerHTML = htmlArray.join('');
                const renderEndTime = performance.now();
                console.log(`✅ renderContracts() 완료 - ${filteredContracts.length}건 렌더링됨 (${(renderEndTime - renderStartTime).toFixed(0)}ms)`);
                renderPagination(); // 페이지네이션 UI 렌더링
        }

            */
            
            try {

                    </div>
                `;
                
                let response;
                if (contractType === 'business') {
                    // 업체 계약서
                    console.log('📋 업체 계약서 로딩...');

                } else {

                    console.log('📋 개인 계약서 로딩...');

                }
                
                console.log('✅ 계약서 데이터 로드 완료:', response.data);
                currentContract = response.data;
                
                // 캐시 저장 (이미지 제외로 용량 절감)

                    cancelBtn.style.display = 'block';
                } else {
                    cancelBtn.style.display = 'none';

                if (currentContract.status === 'active' && currentContract.motorcycle_id) {

        // 백그라운드에서 계약 상세 업데이트 (전체 데이터, 이미지 포함)
        async function loadContractDetailInBackground(contractType, id, cacheKey) {
            try {
                let response;
                if (contractType === 'business') {
                    response = await axios.get(`/api/business-contracts/${id}`);
                } else {
                    response = await axios.get(`/api/contracts/${id}`);
                }
                
                const now = Date.now();
                const newData = response.data;
                
                // 전체 데이터(이미지 포함)로 currentContract 업데이트
                console.log('🔄 백그라운드: 전체 데이터(이미지 포함) 로드 완료');
                currentContract = newData;
                
                // 캐시에는 이미지 제외하고 저장
                try {
                    const { signature_data, id_card_photo, business_license_photo, 
                            motorcycle_photo_front, motorcycle_photo_back, 
                            motorcycle_photo_left, motorcycle_photo_right, ...cacheData } = newData;
                    sessionStorage.setItem(cacheKey, JSON.stringify(cacheData));
                    sessionStorage.setItem(`${cacheKey}_time`, now.toString());
                } catch (e) {
                    console.warn('⚠️ 백그라운드 캐시 저장 실패:', e.message);
                }
                
                // 화면 다시 렌더링 (이제 이미지가 포함됨)
                renderDetail();
                console.log('✅ 백그라운드: 이미지 포함 화면 렌더링 완료');
            } catch (error) {
                console.warn('⚠️ 백그라운드 업데이트 실패 (무시):', error.message);
            }
        }

        // ==========================================
        // 진행 중인 계약서 보험 정보 실시간 업데이트
        // ==========================================
        // 주의: active 상태의 계약서만 실시간 업데이트됩니다.
        // completed 또는 cancelled 상태는 업데이트되지 않습니다.
        // ==========================================
        
        let insuranceUpdateInterval = null;
        
        // 보험 정보 실시간 업데이트 시작
        function startInsuranceAutoUpdate() {
            // ⚠️ 임시: 보험 자동 업데이트 비활성화 (API 에러 방지)
            console.log('⏸️  [임시] 보험 정보 자동 업데이트 비활성화 (서명 표시 우선)');
            return;
            
            // 기존 인터벌 정리
            if (insuranceUpdateInterval) {
                clearInterval(insuranceUpdateInterval);
            }
            
            // 30초마다 오토바이 보험 정보 확인
            insuranceUpdateInterval = setInterval(async () => {
                if (currentContract && currentContract.status === 'active' && currentContract.motorcycle_id) {
                    await refreshInsuranceInfo();
                } else {
                    // active 상태가 아니면 업데이트 중지
                    stopInsuranceAutoUpdate();
                }
            }, 30000); // 30초
            
            console.log('🔄 [진행중 계약서] 보험 정보 자동 업데이트 활성화 (30초마다)');
        }
        
        // 보험 정보 실시간 업데이트 중지
        function stopInsuranceAutoUpdate() {
            if (insuranceUpdateInterval) {
                clearInterval(insuranceUpdateInterval);
                insuranceUpdateInterval = null;
                console.log('⏹️  [진행중 계약서] 보험 정보 자동 업데이트 중지');
            }
        }
        
        // 오토바이 보험 정보 새로고침
        async function refreshInsuranceInfo() {
            // ⚠️ 임시: 보험 정보 새로고침 비활성화
            console.log('⏸️  [임시] 보험 정보 새로고침 비활성화');
            return;
            
            if (!currentContract || !currentContract.motorcycle_id) return;
            if (currentContract.status !== 'active') {
                console.log('⚠️  계약 상태가 active가 아니므로 업데이트하지 않습니다:', currentContract.status);
                return;
            }
            
            try {
                const response = await axios.get(`/api/motorcycles/${currentContract.motorcycle_id}`);
                const motorcycle = response.data;
                
                // 보험 정보가 변경되었는지 확인
                const insuranceChanged = 
                    currentContract.insurance_company !== motorcycle.insurance_company ||
                    currentContract.driving_range !== motorcycle.driving_range ||
                    currentContract.insurance_start_date !== motorcycle.insurance_start_date ||
                    currentContract.insurance_end_date !== motorcycle.insurance_end_date;
                
                if (insuranceChanged) {
                    console.log('🔄 [진행중 계약서] 보험 정보가 변경되었습니다. 계약서 정보 업데이트 중...');
                    console.log('  계약번호:', currentContract.contract_number);
                    console.log('  상태:', currentContract.status);
                    
                    // 현재 계약 객체 업데이트
                    currentContract.insurance_company = motorcycle.insurance_company;
                    currentContract.driving_range = motorcycle.driving_range;
                    currentContract.insurance_start_date = motorcycle.insurance_start_date;
                    currentContract.insurance_end_date = motorcycle.insurance_end_date;
                    currentContract.insurance_age_limit = motorcycle.driving_range; // 보험운전범위
                    
                    // 화면 다시 렌더링
                    renderDetail();
                    
                    // DB에도 업데이트 (진행중인 계약만)
                    await updateContractInsurance();
                    
                    console.log('✅ [진행중 계약서] 보험 정보 업데이트 완료:', {
                        company: motorcycle.insurance_company,
                        range: motorcycle.driving_range,
                        start: motorcycle.insurance_start_date,
                        end: motorcycle.insurance_end_date
                    });
                }
            } catch (error) {
                console.error('[진행중 계약서] 보험 정보 업데이트 실패:', error);
            }
        }
        
        // 계약서 DB의 보험 정보 업데이트 (진행중인 계약만)
        async function updateContractInsurance() {
            if (!currentContract || currentContract.status !== 'active') return;
            
            try {
                // 업체 계약서와 개인 계약서 API 엔드포인트 구분
                const apiEndpoint = currentContract.company_name 
                    ? `/api/business-contracts/${currentContract.id}/insurance`
                    : `/api/contracts/${currentContract.id}/insurance`;
                
                await axios.put(apiEndpoint, {
                    insurance_company: currentContract.insurance_company,
                    driving_range: currentContract.driving_range,
                    insurance_start_date: currentContract.insurance_start_date,
                    insurance_end_date: currentContract.insurance_end_date,
                    insurance_age_limit: currentContract.driving_range
                });
                console.log('💾 [진행중 계약서] DB 보험 정보 업데이트 완료');
            } catch (error) {
                console.error('[진행중 계약서] DB 보험 정보 업데이트 실패:', error);
                // 에러 발생해도 화면 표시는 계속 진행
            }
        }
        
        // 페이지 포커스 시 보험 정보 새로고침 (진행중인 계약만)
        window.addEventListener('focus', () => {
            if (currentContract && currentContract.status === 'active' && currentContract.motorcycle_id) {
                console.log('📍 [진행중 계약서] 페이지 포커스 - 보험 정보 새로고침');
                refreshInsuranceInfo();
            }
        });

        function renderDetail() {
            const c = currentContract;
            if (!c) {
                console.error('❌ currentContract가 없습니다');
                return;
            }
            
            // 🔍 디버깅: 개인 계약서 서명 데이터 확인
            console.log('📝 개인 계약서 렌더링 시작');
            console.log('🖊️ 서명 데이터 존재:', !!c.signature_data);
            if (c.signature_data) {
                console.log('📏 서명 데이터 길이:', c.signature_data.length);
                console.log('🔤 서명 데이터 시작:', c.signature_data.substring(0, 50));
            } else {
                console.error('❌ 서명 데이터가 없습니다!');
                console.log('📦 currentContract 전체:', Object.keys(c));
            }
            
            // 업체 계약서인 경우 별도 렌더링
            if (c.contract_type === 'business' || c.company_name) {
                renderBusinessContractDetail();

        // PDF 다운로드 함수 (기본 파일명)
        async function downloadPDF(customFileName = null) {
            if (!currentContract) {
                alert('계약서 정보를 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
                return;
            }

            try {
                console.log('📄 PDF 생성 시작:', currentContract.contract_number);
                
                // PDF 전용 컨테이너 사용
                const element = document.getElementById('pdfContent');
                
                if (!element) {
                    throw new Error('PDF 컨테이너를 찾을 수 없습니다.');
                }
                
                // 내용이 없으면 렌더링
                if (!element.innerHTML || element.innerHTML.trim() === '') {
                    console.log('📝 PDF 컨테이너 렌더링...');
                    renderDetail();
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                // 최종 확인
                if (!element.innerHTML || element.innerHTML.trim() === '') {
                    throw new Error('렌더링된 내용이 없습니다.');
                }
                
                console.log('✅ 렌더링 확인 완료');
                
                // html2pdf 라이브러리 로드
                if (typeof html2pdf === 'undefined') {
                    console.log('📦 html2pdf 라이브러리 로딩...');
                    await loadHtml2Pdf();
                }

                // 파일명 결정
                let fileName;
                if (customFileName) {
                    // 사용자 지정 파일명
                    fileName = customFileName.endsWith('.pdf') ? customFileName : `${customFileName}.pdf`;
                } else {
                    // 기본 파일명
                    const contractNumber = currentContract.contract_number || 'contract';
                    fileName = `계약서_${contractNumber}.pdf`;
                }

                // A4 최적화 옵션
                const opt = {
                    margin: [8, 10, 8, 10],
                    filename: fileName,
                    image: { 
                        type: 'jpeg', 
                        quality: 0.95 
                    },
                    html2canvas: { 
                        scale: 2,
                        useCORS: true,
                        letterRendering: true,
                        logging: false,
                        scrollY: 0,
                        scrollX: 0
                    },
                    jsPDF: { 
                        unit: 'mm', 
                        format: 'a4', 
                        orientation: 'portrait',
                        compress: true
                    },
                    pagebreak: { 
                        mode: ['avoid-all', 'css', 'legacy'],
                        before: '.page-break-before',
                        after: '.page-break-after',
                        avoid: ['.signature-section', '.terms-agreement', '.contract-terms', '.border-2', 'img', '.bg-indigo-50', '.bg-yellow-50']
                    }
                };

                console.log('🎨 html2canvas 시작...');
                
                // PDF 생성 및 다운로드 (Blob 방식)
                const pdfBlob = await html2pdf().set(opt).from(element).output('blob');
                
                // File System Access API 지원 확인 (Chrome/Edge)
                if (window.showSaveFilePicker) {
                    try {
                        // 저장 위치 선택 대화상자 표시
                        const fileHandle = await window.showSaveFilePicker({
                            suggestedName: fileName,
                            types: [{
                                description: 'PDF 파일',
                                accept: {'application/pdf': ['.pdf']}
                            }]
                        });
                        
                        // 선택한 위치에 파일 쓰기
                        const writable = await fileHandle.createWritable();
                        await writable.write(pdfBlob);
                        await writable.close();
                        
                        console.log('✅ PDF 저장 완료:', fileName);
                        return;
                    } catch (err) {
                        if (err.name === 'AbortError') {
                            console.log('ℹ️ 사용자가 저장을 취소했습니다.');
                            return;
                        }
                        console.warn('⚠️ File System Access API 실패, 기본 다운로드 방식 사용:', err);
                    }
                }
                
                // 기본 다운로드 방식 (파일 시스템 API 미지원 시)
                const blobUrl = URL.createObjectURL(pdfBlob);
                const downloadLink = document.createElement('a');
                downloadLink.href = blobUrl;
                downloadLink.download = fileName;
                
                // 링크 클릭하여 다운로드
                document.body.appendChild(downloadLink);
                downloadLink.click();
                
                // 정리
                document.body.removeChild(downloadLink);
                URL.revokeObjectURL(blobUrl);
                
                console.log('✅ PDF 생성 완료:', fileName);
                
                // 브라우저 설정 안내 (첫 다운로드 시)
                if (!localStorage.getItem('downloadLocationGuideShown')) {
                    localStorage.setItem('downloadLocationGuideShown', 'true');
                    setTimeout(() => {
                        alert('💡 저장 위치 변경 안내:\n\n' +
                              '현재 브라우저는 기본 다운로드 폴더에 자동 저장됩니다.\n\n' +
                              '매번 저장 위치를 선택하려면:\n' +
                              '1. Chrome/Edge: 설정 → 다운로드 → "다운로드 전에 각 파일의 저장 위치 확인" 체크\n' +
                              '2. Firefox: 설정 → 일반 → 다운로드 → "항상 저장 위치 묻기" 선택\n\n' +
                              '또는 다운로드 후 파일을 원하는 폴더로 이동하세요.');
                    }, 1000);
                }
                
            } catch (error) {
                console.error('❌ PDF 생성 오류:', error);
                alert(`PDF 다운로드에 실패했습니다.\n\n오류: ${error.message}\n\n대안: 브라우저 인쇄 기능(Ctrl+P)을 이용해주세요.`);
            }
        }
        
        // 다른 이름으로 저장
        async function downloadPDFWithCustomName() {
            if (!currentContract) {
                alert('계약서 정보를 불러오는 중입니다. 잠시 후 다시 시도해주세요.');

            // 기본 파일명 제안
            const contractNumber = currentContract.contract_number || 'contract';
            const defaultName = `계약서_${contractNumber}`;
            const customerName = currentContract.customer_name || '고객';

            const customName = prompt(

                defaultName
            );
            
            if (customName === null) {
                // 취소 버튼 클릭
                return;
            }
            
            if (customName.trim() === '') {
                alert('파일명을 입력해주세요.');
                return;
            }
            
            // 파일명에서 특수문자 제거 (Windows 파일명 규칙)
            const sanitizedName = customName
                .replace(/[<>:"/\\|?*]/g, '_')  // 금지된 문자를 언더스코어로 대체
                .trim();
            
            console.log('📝 사용자 지정 파일명:', sanitizedName);
            
            // PDF 다운로드 (사용자 지정 파일명 사용)

        // html2pdf 라이브러리 로드
        function loadHtml2Pdf() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        async function completeContract(contractType, id) {
            if (!confirm('이 계약을 완료 처리하시겠습니까?\n\n완료된 계약은 "완료" 상태로 표시되며,\n해당 오토바이는 다시 휴차중 상태가 됩니다.')) {
                return;
            }

            try {
                console.log('✅ 계약 완료 처리 시작:', { contractType, id });
                
                if (contractType === 'business') {
                    // 업체 계약서 완료
                    await axios.put(`/api/business-contracts/${id}/complete`);
                } else {
                    // 개인 계약서 완료
                    await axios.put(`/api/contracts/${id}/complete`);
                }
                
                alert('✅ 계약이 완료 처리되었습니다.\n\n해당 오토바이는 다시 계약할 수 있습니다.');
                
                // 오토바이 목록 캐시 클리어 (계약자 정보 제거)
                sessionStorage.removeItem('motorcycles_cache');
                sessionStorage.removeItem('motorcycles_cache_time');

                    detailModal.classList.add('hidden');

                                계약 위반 시 즉시 해지할 수 있으며, 이 경우 위약금이 부과될 수 있습니다.
                            </p>
                            
                            <p class="mb-2">
                                <strong>제8조 (분쟁 해결)</strong><br>
                                ① 본 계약에서 발생하는 모든 분쟁은 상호 협의하에 원만히 해결한다.<br>
                                ② 본 계약으로 인한 분쟁 발생 시 임대인과 임차인의 합의가 안될시 임대인은 고려신용정보에 계약내용 모두를 위탁을 할수 있습니다.
                            </p>
                        </div>
                    </div>

                    <!-- 서명 -->
                    ${c.signature ? `
                        <div class="border-2 border-gray-300 p-6 rounded-lg mb-6">
                            <h3 class="font-bold text-lg mb-4">고객 서명</h3>
                            <div class="flex justify-center">
                                <img src="${c.signature}" alt="서명" class="border border-gray-300 rounded max-w-md">
                            </div>
                        </div>
                    ` : ''}

                    <!-- 신분증 -->
                    ${c.admin_id_card_photo ? `
                        <div class="border-2 border-gray-300 p-6 rounded-lg mb-6">
                            <h3 class="font-bold text-lg mb-4">신분증 사진</h3>
                            <div class="flex justify-center">
                                <img src="${c.admin_id_card_photo}" alt="신분증" class="border-2 border-gray-300 rounded w-full md:max-w-2xl cursor-pointer hover:border-blue-500 hover:shadow-lg transition-all" onclick="openImageModal('${c.admin_id_card_photo}')" title="클릭하여 확대">
                            </div>
                            <p class="text-center text-sm text-gray-500 mt-2">💡 이미지를 클릭하면 크게 볼 수 있습니다</p>
                        </div>
                    ` : ''}
                </div>
            `;
            
            document.getElementById('contractDetail').innerHTML = html;
            // PDF 생성을 위해 pdfContent에도 동일한 HTML 삽입
            const pdfContentElement = document.getElementById('pdfContent');
            if (pdfContentElement) {
                pdfContentElement.innerHTML = html;
            }
        }

        // 이미지 확대 모달 관련 함수
        let imageModal = null;

        function openImageModal(src) {
            if (!src) return;
            
            // 모달이 없으면 생성
            if (!imageModal) {
                imageModal = document.createElement('div');
                imageModal.className = 'image-modal';
                imageModal.innerHTML = `
                    <div class="image-modal-close" onclick="closeIdCardModal()">
                        <i class="fas fa-times"></i>
                    </div>
                    <img id="modalImage" src="" alt="신분증 확대">
                    <p class="text-white text-sm mt-4">
                        <i class="fas fa-search-plus mr-2"></i>
                        핀치 줌으로 확대/축소 가능
                    </p>
                `;
                document.body.appendChild(imageModal);
                
                // 배경 클릭시 닫기
                imageModal.addEventListener('click', (e) => {
                    if (e.target === imageModal) {
                        closeIdCardModal();
                    }
                });
                
                // ESC 키로 닫기
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && imageModal && imageModal.classList.contains('active')) {
                        closeIdCardModal();
                    }
                });
            }
            
            // 이미지 src 설정 및 모달 표시
            document.getElementById('modalImage').src = src;
            imageModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeIdCardModal() {
            if (imageModal) {
                imageModal.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        // 전체 선택 토글
        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.contract-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = selectAll.checked;
            });
            updateSelectedCount();
        }

        // 선택된 계약서 개수 업데이트
        function updateSelectedCount() {
            const checkboxes = document.querySelectorAll('.contract-checkbox:checked');
            document.getElementById('selectedCount').textContent = `(${checkboxes.length}개 선택됨)`;
            
            // 전체 선택 체크박스 상태 업데이트
            const allCheckboxes = document.querySelectorAll('.contract-checkbox');
            const selectAll = document.getElementById('selectAll');
            selectAll.checked = allCheckboxes.length > 0 && checkboxes.length === allCheckboxes.length;
        }

        // 선택된 계약서들에 SMS 발신
        async function sendBulkSMS() {
            const checkboxes = document.querySelectorAll('.contract-checkbox:checked');
            
            if (checkboxes.length === 0) {
                alert('SMS를 발신할 계약서를 선택해주세요.');
                return;
            }
            
            const contracts = Array.from(checkboxes).map(cb => ({
                id: cb.dataset.id,
                type: cb.dataset.type,
                phone: cb.dataset.phone,
                name: cb.dataset.name,
                number: cb.dataset.number
            }));
            
            // 전화번호가 없는 계약서 체크
            const noPhone = contracts.filter(c => !c.phone || c.phone === '-');
            if (noPhone.length > 0) {
                alert(`전화번호가 없는 계약서가 ${noPhone.length}개 포함되어 있습니다.\n이 계약서들은 SMS가 발송되지 않습니다.`);
            }
            
            const validContracts = contracts.filter(c => c.phone && c.phone !== '-');
            
            if (validContracts.length === 0) {
                alert('전화번호가 있는 계약서가 없습니다.');
                return;
            }
            
            const confirmMsg = `${validContracts.length}개의 계약서에 SMS를 발송하시겠습니까?\n\n` +
                validContracts.map(c => `- ${c.name} (${c.phone})`).join('\n');
            
            if (!confirm(confirmMsg)) return;
            
            try {
                const sessionId = localStorage.getItem('sessionId');
                let successCount = 0;
                let failCount = 0;
                
                for (const contract of validContracts) {
                    try {
                        const shareUrl = `${window.location.origin}/static/${contract.type === 'business' ? 'business-contract-sign' : 'contract-sign'}?contract_id=${contract.id}`;
                        
                        const response = await axios.post('/api/send-sms', {
                            phone: contract.phone,
                            customer_name: contract.name,
                            share_url: shareUrl
                        }, {
                            headers: { 'X-Session-ID': sessionId }
                        });
                        
                        console.log(`✅ SMS 발송 성공 (${contract.name}):`, response.data);
                        successCount++;
                    } catch (err) {
                        console.error(`❌ SMS 발송 실패 (${contract.name}):`, err);
                        console.error('에러 상세:', err.response?.data);
                        failCount++;
                    }
                }
                
                alert(`✅ SMS 발송 완료\n\n성공: ${successCount}건\n실패: ${failCount}건${failCount > 0 ? '\n\n❌ 실패한 SMS가 있습니다.\n브라우저 콘솔(F12)에서 자세한 오류를 확인하세요.' : ''}`);

                
                // 체크박스 초기화
                document.querySelectorAll('.contract-checkbox').forEach(cb => cb.checked = false);
                document.getElementById('selectAll').checked = false;
                updateSelectedCount();
                
                // 목록 즉시 새로고침 (캐시 무시)
                console.log('🔄 SMS 발송 후 계약서 목록 새로고침');
                await loadContracts(true);  // forceRefresh = true
                console.log('✅ 계약서 목록 새로고침 완료');
                
            } catch (error) {
                console.error('SMS 발송 오류:', error);
                alert('SMS 발송 중 오류가 발생했습니다: ' + (error.response?.data?.error || error.message));
            }
        }
    </script>

    <!-- 이미지 확대 모달 -->
    <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-95 hidden z-[9999]">
        <div class="relative w-full h-full flex items-center justify-center p-4">
            <!-- 닫기 버튼 (모바일 친화적) -->
            <button 
                onclick="closeImageModal(); return false;"
                class="absolute top-2 right-2 md:top-4 md:right-4 text-white hover:text-gray-300 z-[10000] 
                       bg-black bg-opacity-50 rounded-full w-12 h-12 md:w-14 md:h-14 
                       flex items-center justify-center text-2xl md:text-4xl
                       active:bg-opacity-70 transition-all"
                style="touch-action: manipulation; -webkit-tap-highlight-color: transparent;">
                <i class="fas fa-times"></i>
            </button>
            
            <!-- Swiper 갤러리 -->
            <div class="w-full h-full max-w-6xl max-h-screen" id="swiperContainer">
                <div class="swiper modalSwiper h-full">
                    <div class="swiper-wrapper" id="modalSwiperWrapper"></div>
                    
                    <!-- 네비게이션 버튼 -->
                    <div class="swiper-button-next text-white"></div>
                    <div class="swiper-button-prev text-white"></div>
                    
                    <!-- 페이지네이션 -->
                    <div class="swiper-pagination"></div>
                </div>
            </div>
        </div>
    </div>

    </script>
</body>
</html>
