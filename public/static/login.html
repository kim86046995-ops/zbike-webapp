<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="cache-buster" content="v20260207-09f14db">
    <title>로그인 - Z-BIKE 전자계약서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-600 via-blue-700 to-purple-800 min-h-screen flex items-center justify-center p-3">
    <!-- 메인 컨테이너 (단일 카드) -->
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
        <!-- 로고 (작게) -->
        <div class="text-center mb-4">
            <img src="/static/zbike-logo.png" alt="Z-BIKE" class="mx-auto mb-2" style="max-width: 120px; height: auto;">
            <h1 class="text-xl font-bold text-gray-800 mb-1">Z-BIKE 전자계약서</h1>
            <p class="text-gray-600 text-xs">오토바이 리스/렌트 관리 시스템</p>
        </div>

        <!-- 2컬럼 레이아웃 -->
        <div class="grid grid-cols-2 gap-3 mb-3">
            <!-- 왼쪽 컬럼 -->
            <div class="space-y-3">
                <!-- 아이디 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">
                        <i class="fas fa-user mr-1"></i>아이디
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        required 
                        autocomplete="off"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                        placeholder="아이디를 입력하세요"
                    >
                </div>

                <!-- 비밀번호 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">
                        <i class="fas fa-lock mr-1"></i>비밀번호
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            required 
                            autocomplete="off"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent pr-8 text-sm"
                            placeholder="비밀번호"
                        >
                        <button 
                            type="button" 
                            id="togglePassword"
                            class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 text-xs"
                        >
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 오른쪽 컬럼: 3개 카드 -->
            <div class="flex flex-col gap-2">
                <!-- 고객정보등록 -->
                <div class="flex-1">
                    <label class="block text-xs font-bold text-gray-700 mb-1">
                        <i class="fas fa-users mr-1"></i>고객정보등록
                    </label>
                    <a 
                        href="/static/customer-portal.html"
                        class="flex items-center justify-center bg-purple-600 text-white rounded-lg font-bold text-sm hover:bg-purple-700 transition transform hover:scale-105 shadow-lg py-2"
                    >
                        <span><i class="fas fa-arrow-right mr-1"></i>등록하기</span>
                    </a>
                </div>
                
                <!-- 업체정보등록 NEW! -->
                <div class="flex-1">
                    <label class="block text-xs font-bold text-gray-700 mb-1">
                        <i class="fas fa-building mr-1"></i>업체정보등록
                    </label>
                    <a 
                        href="/static/business-register.html"
                        class="flex items-center justify-center bg-orange-600 text-white rounded-lg font-bold text-sm hover:bg-orange-700 transition transform hover:scale-105 shadow-lg py-2"
                    >
                        <span><i class="fas fa-store mr-1"></i>등록하기</span>
                    </a>
                </div>
                
                <!-- 업무위탁계약서 -->
                <div class="flex-1">
                    <label class="block text-xs font-bold text-gray-700 mb-1">
                        <i class="fas fa-file-contract mr-1"></i>업무위탁계약서
                    </label>
                    <a 
                        href="/static/work-contract-new.html"
                        class="flex items-center justify-center bg-green-600 text-white rounded-lg font-bold text-sm hover:bg-green-700 transition transform hover:scale-105 shadow-lg py-2"
                    >
                        <span><i class="fas fa-edit mr-1"></i>작성하기</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- 에러 메시지 -->
        <div id="errorMessage" class="hidden mb-3 p-2 rounded-lg bg-red-50 border border-red-200">
            <span id="errorText" class="text-red-700 text-xs flex items-center">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span id="errorContent"></span>
            </span>
        </div>

        <!-- 로그인 폼 -->
        <form id="loginForm">
            <button 
                type="submit" 
                id="loginButton"
                class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold text-base hover:bg-blue-700 transition shadow-md mb-2"
            >
                <i class="fas fa-sign-in-alt mr-2"></i>관리자 로그인
            </button>
        </form>

        <!-- 아이디/비밀번호 찾기 -->
        <div class="mb-3 text-center">
            <a href="#" class="text-xs text-blue-600 hover:text-blue-800">
                <i class="fas fa-question-circle mr-1"></i>아이디 또는 비밀번호를 잊으셨나요?
            </a>
        </div>

        <!-- 구분선 -->
        <div class="relative my-3">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-xs">
                <span class="px-3 bg-white text-gray-500">관리자 계정이 필요하신가요?</span>
            </div>
        </div>

        <!-- 관리자 회원가입 -->
        <a 
            href="/static/register.html"
            class="block w-full bg-green-600 text-white py-2.5 rounded-lg font-bold text-center hover:bg-green-700 transition shadow-md"
        >
            <i class="fas fa-user-plus mr-2"></i>관리자 회원가입
        </a>
    </div>
    
    <script>
        // 자동 로그인 체크 - 이미 로그인되어 있으면 즉시 리다이렉트
        (function checkAutoLogin() {
            // URL에 force_login 파라미터가 있으면 자동 로그인 스킵 (링크 복사 시)
            const urlParams = new URLSearchParams(window.location.search);
            const forceLogin = urlParams.get('force_login');
            
            if (forceLogin === 'true') {
                console.log('⚠️ 강제 로그인 모드 - 자동 로그인 스킵');
                return;
            }
            
            const sessionId = localStorage.getItem('sessionId');
            const user = localStorage.getItem('user');
            
            if (sessionId && user) {
                console.log('✅ 기존 세션 발견 - 즉시 리다이렉트');
                // 세션 검증 없이 즉시 리다이렉트 (검증은 대시보드에서)
                const redirectUrl = urlParams.get('redirect') || '/dashboard';
                window.location.replace(redirectUrl);
            }
        })();
        
        // 버전 체크 및 캐시 강제 무효화
        const CURRENT_VERSION = '20260207-09f14db';
        const storedVersion = localStorage.getItem('login_version');
        
        if (storedVersion !== CURRENT_VERSION) {
            console.log('🔄 새 버전 감지! 캐시 무효화 중...');
            localStorage.setItem('login_version', CURRENT_VERSION);
            
            // Service Worker 제거 시도
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    registrations.forEach(registration => {
                        registration.unregister();
                        console.log('✅ Service Worker 제거됨');
                    });
                });
            }
        }
        
        console.log('✅ 로그인 페이지 버전:', CURRENT_VERSION);
        
        // 비밀번호 표시/숨김
        document.getElementById('togglePassword').addEventListener('click', () => {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        });

        // 폼 제출 처리
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            const errorContent = document.getElementById('errorContent');
            const loginButton = document.getElementById('loginButton');
            
            console.log('📝 로그인 시도:', username);
            
            // 버튼 비활성화
            loginButton.disabled = true;
            loginButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>처리중...';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                console.log('✅ 로그인 응답:', data);
                
                if (response.ok && data.success) {
                    // 세션 저장
                    localStorage.setItem('sessionId', data.sessionId);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // 성공 메시지
                    errorDiv.className = 'mb-4 p-3 rounded-lg bg-green-50 border border-green-200';
                    errorContent.innerHTML = '로그인 성공! 대시보드로 이동 중...';
                    errorDiv.classList.remove('hidden');
                    
                    // 대시보드로 이동 (히스토리 교체하여 뒤로가기 방지)
                    setTimeout(() => {
                        window.location.replace('/dashboard');
                    }, 800);
                } else {
                    throw new Error(data.error || '로그인 실패');
                }
                
            } catch (error) {
                console.error('❌ 로그인 에러:', error);
                
                // 버튼 복구
                loginButton.disabled = false;
                loginButton.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>관리자 로그인';
                
                // 에러 메시지
                errorDiv.className = 'mb-4 p-3 rounded-lg bg-red-50 border border-red-200';
                errorContent.textContent = '아이디 또는 비밀번호가 잘못되었습니다';
                errorDiv.classList.remove('hidden');
            }
        });

        // Enter 키 처리
        document.getElementById('username').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('password').focus();
            }
        });

        // 로그인된 상태에서 뒤로가기로 로그인 페이지 접근 시 대시보드로 리다이렉트
        window.addEventListener('pageshow', function(event) {
            const sessionId = localStorage.getItem('sessionId');
            if (sessionId && event.persisted) {
                // 브라우저 캐시에서 페이지를 로드한 경우 (뒤로가기)
                console.log('🔙 뒤로가기로 로그인 페이지 접근 - 대시보드로 이동');
                window.location.replace('/dashboard');
            }
        });
    </script>
</body>
</html>
